schema = 1

[plugin]
name          = "iface/min"
plugin_type   = "interface"
api_type      = "native"
lang          = "c"
phase         = "late"
version       = "0.1.0.0"

symbol_prefix = "iface_min_"
summary       = "core 极简别名皮肤: 只把 runtime/core 的 log / time / version 三个单元转出(APP 只依赖 Interface)"
license       = "WTFPL"

# Why a **skin** and not a copy of core's declarations (ADR-0038 §4): this plugin used to
# re-declare core's entries by hand (`form = "api"`), i.e. a second source of truth that drifts on
# every core edit. A skin re-exports instead: `reexport_of` names the units, the declarations stay
# in core, and `runtime/core` remains the core layer's only outward door.

[[res]]
kind     = "ram"
used_kib = 1
notes    = "皮肤无状态: 三个空钩子 + 一张转出的头"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u8        = "unsigned char"
br_u16       = "unsigned short"
br_u32       = "unsigned int"
br_u64       = "unsigned long"
br_size_t    = "unsigned long"
br_uintptr_t = "unsigned long"
br_bool      = "int"
br_time_t    = "br_u64"
br_err_t     = "int"

[[dep]]
name  = "runtime/core"
range = ">=0.1.0"
kind  = "type"

# The APP-facing core surface: exactly the units `app/hello` needs, and no more. Widening this
# list widens the APP's compile-time view; it does not widen the dependency rule (the APP still
# sees only `<iface/min/min.h>`, and A-2 still forbids it `<br/core/**>`).
[[export]]
name         = "min-log"
api_iface    = "native"
form         = "skin"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"
reexport_of  = ["runtime/core#log"]

[[export]]
name         = "min-time"
api_iface    = "native"
form         = "skin"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"
reexport_of  = ["runtime/core#time"]

[[export]]
name         = "min-version"
api_iface    = "native"
form         = "skin"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"
reexport_of  = ["runtime/core#version"]

[build]
sources  = ["src/*.c"]
includes = ["include"]
