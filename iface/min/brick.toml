schema = 1

[plugin]
name          = "iface/min"
plugin_type   = "interface"
api_type      = "native"
lang          = "c"
phase         = "late"
version       = "0.1.0.0"

symbol_prefix = "iface_min_"
summary       = "core native 极简别名皮肤: 日志 / 时钟 / tick 计数 / 版本标识(APP 只依赖 Interface)"
license       = "WTFPL"

[[res]]
kind     = "ram"
used_kib = 1
notes    = "皮肤无状态: 三个空钩子 + 一张转出的 core 头"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u64    = "unsigned long"
br_u32    = "unsigned int"
br_bool   = "int"
br_time_t = "br_u64"

[[export]]
name         = "min"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:b19825c94836048a12d481d508f525d8c0b76f072ff044f4d7659f5f87a2cfa1"
status       = "experimental"

[[export.entries]]
kind  = "macro"
name  = "BR_PROTOTYPE_NAME"
value = "\"brickOS-prototype\""
[[export.entries]]
kind  = "macro"
name  = "BR_VERSION_STRING"
value = "\"v0.1.0\""
[[export.entries]]
kind  = "macro"
name  = "BR_US_PER_MS"
value = "1000u"

[[export.entries]]
kind = "func"
name = "br_log_set_level"
sig  = "void (br_log_level_t)"
[[export.entries]]
kind = "func"
name = "br_log_get_level"
sig  = "br_log_level_t (void)"
[[export.entries]]
kind = "func"
name = "br_log_write"
sig  = "void (br_log_level_t, const char*, ...)"
[[export.entries]]
kind = "macro"
name = "br_log_debug"
[[export.entries]]
kind = "macro"
name = "br_log_info"
[[export.entries]]
kind = "macro"
name = "br_log_warn"
[[export.entries]]
kind = "macro"
name = "br_log_error"

[[export.entries]]
kind = "type"
name = "br_time_t"
layout = "# = br_u64(微秒; 设计 3-01 CA-1)"
[[export.entries]]
kind = "func"
name = "br_clock_now"
sig  = "br_time_t (void)"
[[export.entries]]
kind = "func"
name = "br_clock_freq_hz"
sig  = "br_u64 (void)"
[[export.entries]]
kind = "func"
name = "br_clock_ticks_per_ms"
sig  = "br_u64 (void)"
[[export.entries]]
kind = "func"
name = "br_clock_tick_hz"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_clock_tick_count"
sig  = "br_u32 (void)"

[build]
sources  = ["src/*.c"]
includes = ["include"]
