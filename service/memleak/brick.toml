schema = 1

[plugin]
name        = "service/memleak"
plugin_type = "ability"
api_type    = "native"
subkind     = "service"
lang        = "c"
phase       = "late"
version     = "0.1.0.0"
summary     = "泄漏/破坏报告: 按归属标签出存活块账 + 红区/魔数/毒化违约计数(消费 core 的堆观测契约)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 4
notes    = "归属标签注册 + 自检用的记账快照 + 报告行缓冲"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_size_t    = "size_t"
br_uintptr_t = "uintptr_t"
br_owner_t   = "uint16_t"

# core layer (ADR-0038): core is a first-class interface provider. Every consumer declares it --
# transitively reaching `<br/core/**>` through another plugin no longer authorizes anything. The
# door is the skin `runtime/core` (one unit per header); `platform` names `core/c_core` directly
# because the direction table forbids a platform from depending on an ability plugin.
[[dep]]
name  = "runtime/core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "memleak"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:e0c8af553f57b1688e0962b7ed3df883b45923a839e1b693181a536f9470c526"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_memleak_init"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_memleak_report"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_memleak_live"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_memleak_live_by_owner"
sig  = "br_u32 (br_owner_t)"
[[export.entries]]
kind = "func"
name = "br_memleak_corruptions"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_memleak_owner"
sig  = "br_owner_t (void)"
[[export.entries]]
kind = "macro"
name = "BR_MEMLEAK_MAX_ROWS_PER_OWNER"
value = "8"

[selftest]

cases = 0

[build]
sources  = ["src/*.c"]
includes = ["include"]
