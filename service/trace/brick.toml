schema = 1

[plugin]
name        = "service/trace"
plugin_type = "ability"
api_type    = "native"
subkind     = "service"
lang        = "c"
phase       = "late"
version     = "0.1.0.0"
summary     = "trace 观测服务: core 16B 事件环的唯一消费方(drain/解码/计数/呈现)+ 动态事件名注册 + marker"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "动态 id 名字表(32 槽)+ 每 id 消费计数 + 解码行缓冲"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_size_t    = "size_t"
br_uintptr_t = "uintptr_t"

[[export]]
api_iface    = "native"
form         = "api"
name         = "trace"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:b3d67241bfeffc050dfbaa14733ff700a15622cc4b23cf375881f89171b958c5"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_trace_svc_init"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_marker"
sig  = "int (const char*)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_register"
sig  = "int (const char*)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_name"
sig  = "const char* (br_u32)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_report"
sig  = "br_u32 (br_u32)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_summary"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_seen"
sig  = "br_u32 (br_u32)"
[[export.entries]]
kind = "func"
name = "br_trace_svc_reset"
sig  = "void (void)"
[[export.entries]]
kind = "macro"
name = "BR_TRACE_SVC_ID_BASE"
value = "1024"
[[export.entries]]
kind = "macro"
name = "BR_TRACE_SVC_ID_SLOTS"
value = "32"

[selftest]

cases = 0

[build]
sources  = ["src/*.c"]
includes = ["include"]
