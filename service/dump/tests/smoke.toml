# service/dump — conformance 用例(人写)
#
# 由 `brickie new` 生成字段形状(照 `6-01` §2 的用例表契约: {id, pre, steps, expect,
# sched, platform}); **v0.1 不消费它**(无 test 命令, 排 v0.4, §0 边界纪律)。
# 运行期的真身是编进镜像的 `dump_selftest()`(见 src/dump_selftest.c), 由 core 的
# `br_plugin_manager_selftest()` 在全部 start() 之后按 init 拓扑序驱动(ADR-0010),
# 由 `make dbg-test` 在 QEMU 上逐项判 PASS/FAIL; 本表的 id 与镜像日志里的用例 tag 一一对应。
#
# 归属: 本文件覆盖 **dump 自己的用例**(TC-DBG-03x / 100); 兄弟插件的用例
# (TC-DBG-00x trace / 01x backtrace / 02x hexdump / 04x memleak)在各自插件的
# tests/smoke.toml 里, 同样由 core 统一驱动 —— dump 不再汇总它们。
schema = 1

[[case]]
id       = "TC-DBG-030"
pre      = "MMU 已激活, region 表已声明(br_plat_early_init 已完成); 堆已初始化"
steps    = ["br_mm_region_count()", "br_dump_regions() 并核对返回条数", "核对末行 '[DUMP] regions=<n>'"]
expect   = "返回条数 == br_mm_region_count() 且 > 0(清单与 region 表同源同数)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-DBG-031"
pre      = "同上; 0x42000000 在 RAM 窗口(0x40000000 + 8 MiB)之外 ⇒ region 表未声明"
steps    = ["br_dump_memory(0x42000000, 16, BR_DUMP_F_STRICT)", "br_dump_memory(0x42000000, 16, BR_DUMP_F_FORCE)"]
expect   = "STRICT ⇒ -EINVAL; FORCE ⇒ >= 0 且不触发 data abort(表外地址不读取, 只打表头说明)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-DBG-032"
pre      = "同上; br_mem_layout() 可读(堆池已认领)"
steps    = ["br_mem_layout() 取 heap.base", "br_dump_memory(heap.base, 32, BR_DUMP_F_STRICT)", "br_hexdump_to(NULL, 0, heap.base, 32) 取需要长度"]
expect   = "返回 32; hexdump 需要长度 == 2 * br_hexdump_line_bytes()(32 B = 2 整行, 确实渲染)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-DBG-100"
pre      = "堆已初始化、MMU 已开、中断已放行; trace/backtrace/hexdump/memleak 的 init 已按 LATE 相顺序调用"
steps    = ["br_dump_all()", "br_bt_last_count()", "br_mm_region_count()", "br_memleak_live()", "br_memleak_corruptions()"]
expect   = "dump_all 累计行数 >= 8(首末标题 + region + heap + leaks + trace + bt); 且子段观测交叉成立(region_count > 0, bt_last_count > 0, heap_check == 0)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

# ---- 插件生命周期钩子(v0.2 起由 core 的 plugin_manager 按相位驱动)----
#
# 名字 = `symbol_prefix(short)` + 相 ⇒ `dump_early_init` / `dump_init` / `dump_start`
# (生成物 `build/gen/service/dump/plugin_desc.c` 引用)。钩子是组合期契约, 不进 [[export]]。
#
# ★ `dump_init` 的位置 = **LATE 相**, 而且 plugin.toml 对 trace/backtrace/hexdump/memleak
#   各有一条 `kind = "init"` 的边(phase = "late")⇒ plugin_manager 的拓扑序保证它们的
#   init 先返回(没有这四条边, LATE 相顺序会退化成字典序, dump 会排到最前)。
# ★ 调试域一致性用例**不在** `dump_init()` 里跑(ADR-0010): 用例搬到 `src/dump_selftest.c`,
#   由 core 在全部 start() 之后统一驱动; 于是 APP 不再需要 app → service/dump 的依赖边。
[[case]]
id       = "dump-late-init"
pre      = "plugin_manager 已扫 .br_plugins 段并完成拓扑排序; trace/backtrace/hexdump/memleak 的 LATE init 已返回"
steps    = [
    "EARLY 相: dump_early_init()(不碰堆/不读 region)",
    "LATE 相: dump_init() → br_dump_init() → br_dump_all() 取启动快照(用例不在这里跑)",
    "START 相: dump_start()(本插件无动作)",
]
expect   = "返回 0; 日志出现 `dbg: boot snapshot lines=` 与 [PLUGIN] phase=late name=service/dump rc=0; [DBGCONF] SUMMARY fail=0 在随后的 core 自检 pass 里打出"
sched    = ["coop"]
platform = ["qemu-aarch64"]
