schema = 1

[plugin]
name        = "service/dump"
plugin_type = "ability"
api_type    = "native"
subkind     = "service"
lang        = "c"
phase       = "late"
version     = "0.1.0.0"
summary     = "现场倾倒: region 清单 / 边界受检的内存 dump / 堆与泄漏摘要 / trace 呈现 / 栈回溯 + 自带自检套件(dump_selftest)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 4
notes    = "编排状态 + 转调缓冲; dump 路径刻意只用静态缓冲(5-01 §3 的约束)"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_size_t    = "size_t"
br_uintptr_t = "uintptr_t"
br_owner_t   = "uint16_t"

[[dep]]
name   = "service/trace"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_trace_svc_report"

[[dep]]
name   = "service/backtrace"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_bt_print"

[[dep]]
name   = "service/hexdump"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_hexdump_to"

[[dep]]
name   = "service/memleak"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_memleak_report"

[[dep]]
name   = "service/trace"
range  = ">=0.1.0"
kind   = "init"
phase  = "late"

[[dep]]
name   = "service/backtrace"
range  = ">=0.1.0"
kind   = "init"
phase  = "late"

[[dep]]
name   = "service/hexdump"
range  = ">=0.1.0"
kind   = "init"
phase  = "late"

[[dep]]
name   = "service/memleak"
range  = ">=0.1.0"
kind   = "init"
phase  = "late"

[[export]]
api_iface    = "native"
form         = "api"
name         = "dump"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:19c962b129ced77e1f04973db05b196a7ad2f9852df6c7c36097396436335364"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_dump_init"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_dump_regions"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_dump_memory"
sig  = "int (br_uintptr_t, br_size_t, br_u32)"
[[export.entries]]
kind = "func"
name = "br_dump_heap"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_dump_trace"
sig  = "br_u32 (br_u32)"
[[export.entries]]
kind = "func"
name = "br_dump_backtrace"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_dump_leaks"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_dump_all"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "macro"
name = "BR_DUMP_F_STRICT"
value = "0"
[[export.entries]]
kind = "macro"
name = "BR_DUMP_F_FORCE"
value = "1"
[[export.entries]]
kind = "macro"
name = "BR_DUMP_MAX_BYTES"
value = "4096"

[selftest]

cases = 0

[build]
sources  = ["src/*.c"]
includes = ["include"]
