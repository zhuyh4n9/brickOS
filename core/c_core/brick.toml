# ---------------------------------------------------------------- unit `version`: <br/core/br_version.h>
#
# One header = one unit (ADR-0038 §2). Freezing/versioning happens per header, so a change to
# br_log.h cannot move br_mm.h's `compat_gen`. Entries are the header's whole public surface:
# functions with their normalised signature, the types it publishes, and its macros.
[[export]]
name         = "version"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"

[[export.entries]]
kind = "macro"
name = "BR_PROTOTYPE_NAME"
[[export.entries]]
kind = "macro"
name = "BR_VERSION_MAJOR"
value = "0"
[[export.entries]]
kind = "macro"
name = "BR_VERSION_MINOR"
value = "2"
[[export.entries]]
kind = "macro"
name = "BR_VERSION_PATCH"
value = "0"
[[export.entries]]
kind = "macro"
name = "BR_VERSION_STRING"

[selftest]
cases = 42

[build]
# Sources follow the **layer** layout (ADR-0039):
#   src/main.c          the boot chain (the only code that knows the four phases' hard order)
#   src/base/           log / trace / time / string / panic (no hardware, no scheduler)
#   src/plugin/         plugin manager (scan/topology/phases) + service registry
# The interrupt framework, the memory pools and the scheduling framework live in `hal/{int,mm,sched}`
# (ADR-0039 route B), each with its own unit and `[build].selftest_sources`.
sources  = ["src/**/*.c", "src/**/*.S"]
includes = ["include"]
