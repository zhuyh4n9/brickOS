schema = 1

[plugin]
name        = "core/c_core"
plugin_type = "core"
api_type    = "native"
lang        = "c"
phase       = "early"
# Explicit prefix so the descriptor's hooks carry the core's own names (`br_core_*`): the only one
# it actually emits is `.selftest = br_core_selftest` (the suite entry in selftest/).
symbol_prefix = "br_core_"
version     = "0.2.0.0"
summary     = "内核本体(C 实现): 四阶段启动链 br_core_main + 插件管理器(扫段/拓扑/四相/自检) + 基座(日志/时钟/trace/字符串/panic) 与 20 个单元中的 11 个; 中断/内存/调度框架在 hal/* (ADR-0039)"
license     = "WTFPL"

# `core` is mandatory and singular: exactly one `plugin_type = "core"` plugin per image (solver
# enforces it, the manager re-proves it at runtime). It defines **no lifecycle** -- early_init /
# init / start are emitted as BR_PLUGIN_NO_HOOK -- because it is the plugin that *drives* the
# others: `br_core_main()` runs the boot chain and `br_plugin_manager_*()` drives the phases.
# The `core/` namespace holds implementations; `core/c_core` is the C one (an `r_core` for the
# Rust implementation is planned).

[[res]]
kind     = "ram"
used_kib = 8
notes    = "启动链 + 插件表/边表(sched 自身状态) + trace 环 256×16 B = 4 KiB + 字符串/日志状态 ≈ 8 KiB; 中断/内存/调度框架已拆到 hal/* (ADR-0039)"

# The boot chain drives the HAL (ADR-0039): `br_irq_cpu_init()` in phase 1, `br_mem_init()` +
# `br_mm_activate()` in phase 3, `br_sched_run()` at the end of phase 4. The order is hard-coded in
# `br_core_main`, which is why these are `runtime` edges and **not** `init` edges (the HAL bricks
# have no init hook: their order is the boot chain's, not the topological sort's).
[[dep]]
name  = "hal/int"
range = ">=0.1.0"
kind  = "runtime"

[[dep]]
name  = "hal/mm"
range = ">=0.1.0"
kind  = "runtime"

[[dep]]
name  = "hal/sched"
range = ">=0.1.0"
kind  = "runtime"

# No `[compat]`: `compat.core` is how the *other* plugins pin the core they are written against,
# and the core cannot be compatible with itself. `[plugin].version` above is what they resolve to.

# Self-test is **not** a lifecycle phase: the core plugin declares its suite here like any other
# plugin, and the generated descriptor emits `.selftest = br_core_selftest` (the suite entry in
# selftest/). Off ⇒ the product switch writes NO_HOOK and the suite is not compiled.

# `[iface.typedefs]`: the surface hash expands these aliases to their canonical C spelling, so a
# future non-C core (`runtime/...` implemented in Rust) whose normalised signatures match still
# produces the same `surface_hash` (iface.rs::canonical_sig).
[iface.typedefs]
br_u8       = "unsigned char"
br_s8       = "signed char"
br_u16      = "unsigned short"
br_s16      = "signed short"
br_u32      = "unsigned int"
br_s32      = "signed int"
br_u64      = "unsigned long"
br_s64      = "signed long"
br_size_t   = "unsigned long"
br_uintptr_t = "unsigned long"
br_intptr_t = "signed long"
br_bool     = "int"
br_time_t   = "br_u64"
br_err_t    = "int"


# ---------------------------------------------------------------- unit `log`: <br/core/br_log.h>
#
# One header = one unit (ADR-0038 §2). Freezing/versioning happens per header, so a change to
# br_log.h cannot move br_mm.h's `compat_gen`. Entries are the header's whole public surface:
# functions with their normalised signature, the types it publishes, and its macros.
[[export]]
name         = "log"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"

[[export.entries]]
kind = "enum"
name = "br_log_level_t"
ops = ["BR_LOG_DEBUG", "BR_LOG_INFO", "BR_LOG_WARN", "BR_LOG_ERROR", "BR_LOG_LEVEL_COUNT"]
[[export.entries]]
kind = "func"
name = "br_log_get_level"
sig = "br_log_level_t (void)"
[[export.entries]]
kind = "func"
name = "br_log_init"
sig = "void (void)"
[[export.entries]]
kind = "func"
name = "br_log_set_level"
sig = "void (br_log_level_t)"
[[export.entries]]
kind = "func"
name = "br_log_write"
sig = "void (br_log_level_t,const char *,...)"

