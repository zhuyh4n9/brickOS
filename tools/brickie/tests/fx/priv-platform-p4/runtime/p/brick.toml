schema = 1

[plugin]
name        = "runtime/p"
plugin_type = "runtime"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"

[compat]
core       = ">=1.0.0"
hash_scope = "decl"
truth      = "decl"

[privileged]
level = "P4"
[[privileged.memory]]
granularity = "page"
ops     = ["map", "protect"]
regions = ["mmio"]

[build]
sources  = ["src/*.c"]
includes = ["include"]
