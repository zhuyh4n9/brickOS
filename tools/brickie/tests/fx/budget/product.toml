schema = 1

[product]
name     = "hsm"
version  = "0.1.0.0"
app      = { brick = "app/hsm", requires = {} }
platform = { brick = "platform/qemu-aarch64", requires = {} }
core     = { brick = "core/c_core", requires = {} }
stage    = "dev"

[[product.ability]]
big-a = { brick = "service/big-a", requires = {} }
big-b = { brick = "service/big-b", requires = {} }

[budget]
ram_kib   = 512
stack_kib = 16

[lint]
frozen_deps = "inherit"
allow_edges = []
