schema = 1

[plugin]
name        = "sched/coop"
plugin_type = "ability"
api_type    = "native"
lang        = "c"
subkind     = "scheduler"
sched_class = "COOP_ONLY"
phase       = "core"
version     = "0.1.0.0"

[compat]
core       = ">=1.0.0"
hash_scope = "decl"
truth      = "decl"

[[dep]]
name  = "platform/qemu-aarch64"
range = "*"
kind  = "init"

[[export]]
name         = "coop"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = ""
status       = "experimental"



[build]
sources  = ["src/*.c"]
includes = ["include"]
