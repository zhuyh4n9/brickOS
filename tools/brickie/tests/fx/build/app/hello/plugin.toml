schema = 1

[plugin]
name        = "app/hello"
plugin_type = "app"
api_type    = "native"
lang        = "c"
phase       = "app"
version     = "0.1.0.0"

[compat]
core       = ">=1.0.0"
hash_scope = "decl"
truth      = "decl"

[[dep]]
name  = "iface/hello-api"
range = "*"
kind  = "runtime"

[[export]]
name         = "hello"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = ""
status       = "experimental"



[build]
sources  = ["src/*.c"]
includes = ["include"]
