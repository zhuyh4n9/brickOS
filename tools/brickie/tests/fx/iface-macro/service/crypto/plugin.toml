schema = 1

[plugin]
name        = "service/crypto"
plugin_type = "ability"
api_type    = "native"
lang        = "c"
subkind     = "service"
phase       = "late"
version     = "0.1.0.0"

[compat]
core       = ">=1.0.0"
hash_scope = "decl"
truth      = "decl"


[[export]]
name         = "crypto"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "frozen"
hash         = ""
status       = "frozen"
[[export.entries]]
kind = "func"
name = "crypto_hash"
sig = "int(const uint8_t*, size_t)"
status = "frozen"
[[export.entries]]
kind = "macro"
name = "BR_MAX"
value = "16"
status = "frozen"



[build]
sources  = ["src/*.c"]
includes = ["include"]
