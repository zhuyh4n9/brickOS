schema = 1

[plugin]
name        = "provider/adapter"
plugin_type = "ability"
api_type    = "runtime_adapter"
lang        = "c"
subkind     = "service"
phase       = "late"
version     = "0.1.0.0"

[compat]
core       = ">=1.0.0"
hash_scope = "decl"
truth      = "decl"

[[dep]]
name  = "provider/sqlite"
range = "*"
kind  = "type"

[[export]]
name         = "adapter"
api_iface    = "runtime_adapter"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = ""
status       = "experimental"

[build]
sources  = ["src/*.c"]
includes = ["include"]
