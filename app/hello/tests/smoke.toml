# app/hello — conformance 用例(人写)
#
# 字段形状照 `6-01` §2 的用例表契约: {id, pre, steps, expect, sched, platform}。
# 运行期的真身是编进镜像、由 **core 的自检 pass** 驱动的两个套件(ADR-0010):
#   `br_plugin_selftest()`(core 的插件管理器, `[PLGCONF]`)
#   `br_service_selftest()`(core 的服务注册表, `[SVCCONF]`)
# 逐用例 tag 与镜像日志一一对应, 由 `brickie test plugin-test`(QEMU)判红绿。
#
# 为什么这些用例记在 APP 名下: **历史原因** —— 它们的调用点曾经在 APP 的 start
# (插件管理器的自证要"段已驱动完"这个上下文, 而那时只有 APP 能提供)。ADR-0010 把驱动
# 权收归 core 之后, 调用点已不在 APP; 本文件作为**用例声明面**保持原有 id 不动
# (改 id 会牵动门禁的逐 tag 点名, 而那与"测试住在哪"无关)。
schema = 1

[[case]]
id       = "TC-PLUG-001"
pre      = "br_core_main() 阶段 ① 已调 br_irq_cpu_init 与 br_plugin_manager_init()(扫过 .br_plugins); 生成物已编进镜像"
steps    = ["br_plugin_count()", "读生成物计数符号 br_plugin_gen_total", "比对两者"]
expect   = "段非空 且 条数 == 生成物数量(生成物计数符号在场)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PLUG-002"
pre      = "同上; 插件树里 service/dump 对四个 service 声明了 kind = \"init\" 的边"
steps    = ["取拓扑序", "逐条检查: 每条 init 边的提供方位次 < 消费方位次"]
expect   = "全部 init 边被拓扑序满足(违例时报出具体边)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PLUG-003"
pre      = "同上; 各插件 plugin.toml 的 phase 与类别一致(非 Service/Interface ⇒ core, Service/Interface ⇒ late)"
steps    = [
  "逐条检查 init 边: rank(提供方完成点) <= rank(消费方完成点)",
  "检查 EARLY 相第一步是否为 platform 插件的 early_init",
  "检查 APP 的 start 是否在所有非 APP 的 start 之后",
]
expect   = "相位单调成立; early 相第一步是 platform; APP 最后(非 APP 的 start 全先跑完); 且自检跑在**全部 start 之后**(ADR-0010 换过判据, 见 core/selftest/plugin_selftest.c)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PLUG-002b"
pre      = "同上(负例, 用假边集, 不碰真段)"
steps    = ["构造 3 节点环 a→b→c→a 跑拓扑排序", "构造 3 节点 DAG c→b→a 跑同一函数"]
expect   = "环被检出且报出完整路径(3 节点 + 收尾闭合); 同一算法对无环图排得出序"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-SVC-001"
pre      = "core 的服务注册表可用(发布/查找都发生在 init 相, 单线程)"
steps    = ["br_service_publish(\"selftest.svc.a\", &ops)", "br_service_lookup 同一名字", "br_service_count/name_at 交叉核对"]
expect   = "返回同一指针; count 增 1 且 name_at 能命中; lookup 记账 hits >= 1"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-SVC-002"
pre      = "同上(TC-SVC-001 已发布 selftest.svc.a)"
steps    = ["用同一名字 publish 第二个 ops 指针"]
expect   = "返回 -EEXIST, 且 lookup 仍拿到**第一个**指针(不覆盖)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-SVC-003"
pre      = "同上"
steps    = ["lookup 一个未发布的名字", "publish(NULL, ops)", "publish(name, NULL)"]
expect   = "查不到 ⇒ NULL; 空 name / 空 ops ⇒ -EINVAL"
sched    = ["coop"]
platform = ["qemu-aarch64"]

# 收尾口径: 用例自用的名字全部带 `selftest.` 前缀, 且用例结束前从表里移除
# (br_service_selftest 的白盒动作) —— 不污染后续 dump 的注册表清单。

# ---- ADR-0019: APP 侧 POSIX 多线程样例(经 iface/posix 皮肤; 门禁 = smoke 逐 tag 点名) ----

[[case]]
id       = "APP-PT-001"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "三线程 + barrier 起跑: mutex 保护计数 3×500; pthread_barrier_init(4) 四方会合; join 的 retval 之和==6 且计数==1500",
]
expect   = "[APPCONF] PASS APP-PT-001 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-002"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "condvar 会合: 工作线程 lock/就绪计数/cond_signal 后 cond_wait; 主线程等全部就绪后 broadcast 放行; 全部 join 成功",
]
expect   = "[APPCONF] PASS APP-PT-002 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-003"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "TLS key: pthread_key_create(dtor)+每线程 setspecific/yield/getspecific 隔离; 退出析构之和==6; key_delete==0",
]
expect   = "[APPCONF] PASS APP-PT-003 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-004"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "detach: attr DETACHED 建线程(卡 sem): join⇒EINVAL; 放行后 ran==1; 之后 pthread 调用惰性回收",
]
expect   = "[APPCONF] PASS APP-PT-004 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-005"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "每线程 errno: 两线程各写 ENOENT/EACCES, barrier 后再读仍是各自的值",
]
expect   = "[APPCONF] PASS APP-PT-005 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-006"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "rwlock: 两读者并发(active_max>=2)、写者独占(active==0 才进)、4 次写生效、无违例",
]
expect   = "[APPCONF] PASS APP-PT-006 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "APP-PT-007"
pre      = "APP 线程已创建且 iface/posix/runtime-posix 已 init"
steps    = [
    "once + name: 三线程 pthread_once ⇒ 恰一次; setname_np('app-worker') 后 getname_np 读回一致",
]
expect   = "[APPCONF] PASS APP-PT-007 ..."
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

