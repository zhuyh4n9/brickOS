schema = 1

[plugin]
name        = "hal/int"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "early"
symbol_prefix = "hal_int_"
version     = "0.2.0.0"
summary     = "中断框架(HAL): 描述符池/优先级/三层屏蔽/PIC 注册/级联域/下半部 bh/fault+extable"
license     = "WTFPL"

[[res]]
kind     = "ram"
used_kib = 3
notes    = "描述符池/运行期表/域池 ≈ 8.3 KiB(设计容量, 静态数组); 不含 PIC 本体(platform)"

# The HAL layer (ADR-0039) sits **below** `ability`: it may use `core/c_core` (base: log/trace/panic),
# never an ability. `platform` implements the PIC/exception stubs it declares and calls its APIs, so
# `platform -> hal` is legal while `hal -> ability` is not.
#
# The IRQ exit hands control to the scheduler through `br_irq_hooks_t` (installed by `hal/sched`),
# so this brick does not depend on the scheduler brick -- see br_irq.h.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

# `[iface.typedefs]`: the surface hash expands these aliases to their canonical C spelling, so a
# future non-C implementation whose normalised signatures match still produces the same
# `surface_hash` (iface.rs::canonical_sig).
[iface.typedefs]
br_u8       = "unsigned char"
br_s8       = "signed char"
br_u16      = "unsigned short"
br_s16      = "signed short"
br_u32      = "unsigned int"
br_s32      = "signed int"
br_u64      = "unsigned long"
br_s64      = "signed long"
br_size_t   = "unsigned long"
br_uintptr_t = "unsigned long"
br_intptr_t = "signed long"
br_bool     = "int"
br_time_t   = "br_u64"
br_err_t    = "int"

