schema = 1

[plugin]
name        = "hal/vfs-core"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "纯 VFS: br_file_t 句柄 + 挂载表单路由 + 四层 ops(super/inode/file/dentry 预留) + 逐级 lookup 走查"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 8
notes    = "挂载表 8 槽(路径 64 B/槽)+ 句柄在 core 堆上; 静态部分约 0.6 KiB, 余量给将来的 dentry 预留"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u8        = "uint8_t"
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_s64       = "int64_t"
br_size_t    = "size_t"
br_bool      = "int"
br_uintptr_t = "uintptr_t"

# Core layer (ADR-0038/0039): a HAL brick is **inside the trusted base**, below `ability`, so it
# names `core/c_core` directly -- the `provider/core` skin exists to keep *ability/interface*
# consumers from being tied to core's identity, and the direction table forbids `hal -> ability`.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "vfs"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:744bb3605fe427a7ad376dba45600552c14fbe44d8597459b9a0c81fff1ffb57"
status       = "experimental"

