schema = 1

[plugin]
name        = "hal/cdev-core"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "字符设备子分类: br_cdev_ops 会话形状 + flash 子型 + 通用 br_file_ops 会话适配(devfs 经钩子取得)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "cdev 槽 8 + flash 槽 4(约 0.5 KiB); 每文件会话 cdev_file_t 在 core 堆上(16 B/打开)"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32    = "uint32_t"
br_s64    = "int64_t"
br_size_t = "size_t"

[[dep]]
name  = "hal/dev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "hal/vfs-core"
range = ">=0.1.0"
kind  = "type"

# Core layer (ADR-0038/0039): a HAL brick is **inside the trusted base**, below `ability`, so it
# names `core/c_core` directly -- the `runtime/core` skin exists to keep *ability/interface*
# consumers from being tied to core's identity, and the direction table forbids `hal -> ability`.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "cdev"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:46b125d4480ef7d3e1d20fe4528a0504d31e973e9678e65c19e58cbf39a40641"
status       = "experimental"

[[export.entries]]
kind = "type"
name = "br_cdev_ops_t"
layout = "# {open, read, write, ioctl, poll, close, suspend, resume}"
[[export.entries]]
kind = "type"
name = "br_flash_geom_t"
layout = "# {read_size, prog_size, block_size, block_count}"
[[export.entries]]
kind = "type"
name = "br_flash_ops_t"
layout = "# {read, program, erase, sync, ioctl, suspend, resume}"

[[export.entries]]
kind = "func"
name = "br_cdev_register"
sig  = "int (const char*, const br_cdev_ops_t*, void*)"
[[export.entries]]
kind = "func"
name = "br_cdev_get"
sig  = "const br_cdev_ops_t* (const char*, void**)"
[[export.entries]]
kind = "func"
name = "br_flash_register"
sig  = "int (const char*, const br_flash_ops_t*, const br_flash_geom_t*, void*)"
[[export.entries]]
kind = "func"
name = "br_flash_get"
sig  = "const br_flash_ops_t* (const char*, void**)"
[[export.entries]]
kind = "func"
name = "br_flash_geom_get"
sig  = "int (const char*, br_flash_geom_t*)"
[selftest]

cases = 8


# `br_malloc`/`br_free` (ADR-0039: memory is a HAL brick now).
[[dep]]
name  = "hal/mm"
range = ">=0.1.0"
kind  = "runtime"


[build]
sources  = ["src/*.c"]
includes = ["include"]
