schema = 1

[plugin]
name        = "hal/dev-core"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "通用设备注册表: 唯一扁平命名空间 + 命名规则 + 子分类注册协议 + open_file 钩子透传 + ioctl 编码"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "注册表 16 槽(名字 32 B + 条目 32 B/槽 ≈ 1 KiB); 无动态分配"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u8        = "uint8_t"
br_u16       = "uint16_t"
br_u32       = "uint32_t"
br_bool      = "int"
br_uintptr_t = "uintptr_t"

[[dep]]
name  = "hal/vfs-core"
range = ">=0.1.0"
kind  = "type"

# Core layer (ADR-0038/0039): a HAL brick is **inside the trusted base**, below `ability`, so it
# names `core/c_core` directly -- the `runtime/core` skin exists to keep *ability/interface*
# consumers from being tied to core's identity, and the direction table forbids `hal -> ability`.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "dev"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:683df2ce258eb70fb96849760f12e29b976aefbdb56212857ffd7d287c0de952"
status       = "experimental"

[[export.entries]]
kind = "macro"
name = "BR_CLASS_NONE"
value = "0u"
[[export.entries]]
kind = "macro"
name = "BR_CLASS_CDEV"
value = "1u"
[[export.entries]]
kind = "macro"
name = "BR_CLASS_BDEV"
value = "2u"

[[export.entries]]
kind = "macro"
name = "BR_DEV_MAX"
value = "16u"

[[export.entries]]
kind = "macro"
name = "BR_IOC_NONE"
value = "0u"
[[export.entries]]
kind = "macro"
name = "BR_IOC_WRITE"
value = "1u"
[[export.entries]]
kind = "macro"
name = "BR_IOC_READ"
value = "2u"

[[export.entries]]
kind = "type"
name = "br_dev_class_entry_t"
layout = "# {class_id, class_priv, open_file, dev_priv}"

[[export.entries]]
kind = "func"
name = "br_dev_add"
sig  = "int (const char*, const br_dev_class_entry_t*)"
[[export.entries]]
kind = "func"
name = "br_dev_lookup"
sig  = "const br_dev_class_entry_t* (const char*)"
[[export.entries]]
kind = "func"
name = "br_dev_count"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_dev_name_at"
sig  = "const char* (br_u32)"
[[export.entries]]
kind = "func"
name = "br_dev_entry_at"
sig  = "const br_dev_class_entry_t* (br_u32)"
[[export.entries]]
kind = "func"
name = "br_dev_name_valid"
sig  = "br_bool (const char*)"
[selftest]

cases = 6

[build]
sources  = ["src/*.c"]
includes = ["include"]
