schema = 1

[plugin]
name        = "hal/mm"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "early"
symbol_prefix = "hal_mm_"
version     = "0.2.0.0"
summary     = "内存(HAL): 三池(heap/contig/page/DMA)+ TLSF + 地址映射 mm(ops 表由 platform 注册)"
license     = "WTFPL"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "池本体在 platform 的 region 表里, 本项只含堆控制块/TLSF 位图/页位图/映射表 ≈ 2 KiB(静态上界)"

# HAL layer (ADR-0039): memory mechanisms only. The three pool *sizes* come from the platform region
# table; the page-table ops come from `platform` (registered via `br_mm_register`), so this brick
# never names a platform plugin. `ability` bricks select it; it never depends upward.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

# `[iface.typedefs]`: the surface hash expands these aliases to their canonical C spelling, so a
# future non-C implementation whose normalised signatures match still produces the same
# `surface_hash` (iface.rs::canonical_sig).
[iface.typedefs]
br_u8       = "unsigned char"
br_s8       = "signed char"
br_u16      = "unsigned short"
br_s16      = "signed short"
br_u32      = "unsigned int"
br_s32      = "signed int"
br_u64      = "unsigned long"
br_s64      = "signed long"
br_size_t   = "unsigned long"
br_uintptr_t = "unsigned long"
br_intptr_t = "signed long"
br_bool     = "int"
br_time_t   = "br_u64"
br_err_t    = "int"

# ---------------------------------------------------------------- unit `mem`: <br/core/br_mem.h>
#
# One header = one unit (ADR-0038 §2). Freezing/versioning happens per header, so a change to
# br_log.h cannot move br_mm.h's `compat_gen`. Entries are the header's whole public surface:
# functions with their normalised signature, the types it publishes, and its macros.
[[export]]
name         = "mem"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"

