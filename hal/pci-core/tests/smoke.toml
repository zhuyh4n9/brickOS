# hal/pci-core — conformance 用例(人写)
#
# 与 `pci_core_selftest()`(src/pci_selftest.c)里的 TC-PCI-001..008 一一对应:
# 红绿由 in-image 套件打 `[PCICONF] PASS/FAIL`, 末尾 SUMMARY; 该钩子在描述符里, 由
# **core** 在全部 start() 之后统一驱动(ADR-0010); 门禁 `smoke` 要求
# `[PCICONF] SUMMARY pass=N fail=0`。本文件是同一批用例的**声明面骨架**,
# 不是可执行形式(in-image 套件才是), 形状照 `6-01` §2 的字段契约。
# 设计出处: 无设计文档条目; 裁定见 ADR-0021 D-2/D-4。
schema = 1

[[case]]
id       = "TC-PCI-001"
pre      = "pci-core 的 CORE init 已跑(brickie 组合里 pci-core 在 platform 之后初始化)"
steps    = [
    "br_pci_dev_count() >= 1(本镜像的 QEMU 参数挂了 sdhci-pci + 默认网卡)",
    "br_pci_dev_count() <= BR_PCI_MAX_DEVS(静态上界)",
]
expect   = "[PCICONF] PASS TC-PCI-001 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-002"
pre      = "QEMU 参数含 -device sdhci-pci,addr=3"
steps    = [
    "br_pci_find(0x1b36, 0x0007) != NULL",
    "命中项的 class_code == BR_PCI_CLASS_SDHCI(0x0805, System SDHCI)",
]
expect   = "[PCICONF] PASS TC-PCI-002 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-003"
pre      = "TC-PCI-002 命中 sdhci"
steps    = [
    "sdhci->bar[0] != 0(BAR 真的被分配了 —— 本镜像无固件, 分配是本件的职责)",
    "sdhci->bar_size[0] >= 256",
    "bar0 落在 br_plat_pci_host() 的 MMIO 窗口内",
    "bar0 % bar_size == 0(按自身尺寸对齐)",
]
expect   = "[PCICONF] PASS TC-PCI-003 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-004"
pre      = "TC-PCI-002 命中 sdhci"
steps    = [
    "br_pci_cfg_read32(bus,dev,fn,0x04,&cmd) == 0",
    "cmd & PCI_CMD_MEM_SPACE(bit1) != 0(寄存器窗口可解码)",
    "cmd & PCI_CMD_BUS_MASTER(bit2) != 0(DMA 可发起)",
    "cmd & PCI_CMD_INTX_DIS(bit10) == 0(INTx 未被禁用)",
]
expect   = "[PCICONF] PASS TC-PCI-004 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-005"
pre      = "TC-PCI-002 命中 sdhci; 其 PCI_INTERRUPT_PIN == 1(pin A)"
steps    = [
    "sdhci->intx_virq == platform.intx_virq_a + (sdhci->dev % 4)",
    "语义: QEMU GPEX 的 INTx swizzle = (pin_index + slot) % 4, pin A ⇒ pin_index = 0",
]
expect   = "[PCICONF] PASS TC-PCI-005 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-006"
pre      = "TC-PCI-002 命中 sdhci"
steps    = [
    "cfg_read32(off=0x00) == (device<<16 | vendor)(配置空间往返)",
    "cfg_read32(off=0x02) == -EINVAL(未按 4 对齐)",
    "cfg_read32(..., out=NULL) == -EINVAL",
]
expect   = "[PCICONF] PASS TC-PCI-006 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-007"
pre      = "设备表可观测"
steps    = [
    "br_pci_find(0xFFFF, 0xFFFF) == NULL",
    "br_pci_dev_at(count) == NULL;br_pci_dev_at(count + 1) == NULL",
]
expect   = "[PCICONF] PASS TC-PCI-007 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-PCI-008"
pre      = "设备表可观测"
steps    = [
    "把每条设备的每个已分配 BAR 展开成 [base, base+size) 区间",
    "断言任意两个区间不相交(BAR 分配游标只前进、不回头)",
]
expect   = "[PCICONF] PASS TC-PCI-008 ..."
sched    = ["coop"]
platform = ["qemu-aarch64"]
