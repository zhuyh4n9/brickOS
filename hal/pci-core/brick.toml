schema = 1

[plugin]
name        = "hal/pci-core"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "通用 PCI(e): ECAM 配置空间访问 + 总线枚举 + BAR 尺寸探测/分配 + 命令寄存器(MEM/BUS_MASTER) + INTx swizzle + 设备表"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 1
notes    = "设备表 8 条(每条 ~88 B: 身份 + 6 对 BAR 基址/尺寸 + INTx); 无动态分配"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u8        = "uint8_t"
br_u16       = "uint16_t"
br_u32       = "uint32_t"
br_uintptr_t = "uintptr_t"

[[dep]]
name  = "runtime/qemu-aarch64"
range = ">=0.1.0"
kind  = "init"

# Core layer (ADR-0038/0039): a HAL brick is **inside the trusted base**, below `ability`, so it
# names `core/c_core` directly -- the `provider/core` skin exists to keep *ability/interface*
# consumers from being tied to core's identity, and the direction table forbids `hal -> ability`.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "pci"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:70a388148c492ce7df3eaea8781d9eb0be6cd0f614ae07732d6960ab84c3ccd5"
status       = "experimental"

[[export.entries]]
kind = "macro"
name = "BR_PCI_MAX_DEVS"
value = "8"
[[export.entries]]
kind = "macro"
name = "BR_PCI_MAX_BARS"
value = "6"
[[export.entries]]
kind = "macro"
name = "BR_PCI_CLASS_SDHCI"
value = "0x0805"

[[export.entries]]
kind = "type"
name = "br_pci_dev_t"
layout = "# {vendor, device, class_code, revision, bus, dev, fn, intx_pin, _pad, intx_virq, bar[6], bar_size[6]}"

[[export.entries]]
kind = "func"
name = "br_pci_init"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_pci_dev_count"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_pci_dev_at"
sig  = "const br_pci_dev_t* (br_u32)"
[[export.entries]]
kind = "func"
name = "br_pci_find"
sig  = "const br_pci_dev_t* (br_u16, br_u16)"
[[export.entries]]
kind = "func"
name = "br_pci_cfg_read32"
sig  = "int (br_u8, br_u8, br_u8, br_u8, br_u32*)"
[[export.entries]]
kind = "func"
name = "br_pci_cfg_write32"
sig  = "int (br_u8, br_u8, br_u8, br_u8, br_u32)"

[selftest]

cases = 8

[build]
sources  = ["src/*.c"]
includes = ["include"]
