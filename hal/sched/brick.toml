schema = 1

[plugin]
name        = "hal/sched"
plugin_type = "hal"
api_type    = "native"
lang        = "c"
phase       = "early"
symbol_prefix = "hal_sched_"
version     = "0.2.0.0"
summary     = "调度框架(HAL): TCB 池/上下文切换 switch.S/就绪队列/超时扫描/同步原语/下半部工作队列"
license     = "WTFPL"

[[res]]
kind     = "ram"
used_kib = 3
notes    = "TCB 池 8 × (头 + 插件尾) + 就绪/等待链 + 工作队列 16 项 ≈ 3 KiB; 栈本体归 platform 与调用方"

# HAL layer (ADR-0039): the scheduling *framework* (mechanism). The concrete policy is an `ability`
# brick (`sched/rr`, `sched/coop`) that registers through `br_sched_register()`; this brick boots it
# with `br_sched_run()` and installs `br_irq_hooks_t` so the IRQ exit can reschedule.
#
# `switch.S` and the TCB layout (`sched_internal.h` / `sched_ctx.h`) are one artifact: keeping them
# in the same brick is what makes "the assembly reads the C struct offsets" checkable.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "runtime"

[[dep]]
name  = "hal/int"
range = ">=0.1.0"
kind  = "runtime"

# `[iface.typedefs]`: the surface hash expands these aliases to their canonical C spelling, so a
# future non-C implementation whose normalised signatures match still produces the same
# `surface_hash` (iface.rs::canonical_sig).
[iface.typedefs]
br_u8       = "unsigned char"
br_s8       = "signed char"
br_u16      = "unsigned short"
br_s16      = "signed short"
br_u32      = "unsigned int"
br_s32      = "signed int"
br_u64      = "unsigned long"
br_s64      = "signed long"
br_size_t   = "unsigned long"
br_uintptr_t = "unsigned long"
br_intptr_t = "signed long"
br_bool     = "int"
br_time_t   = "br_u64"
br_err_t    = "int"

