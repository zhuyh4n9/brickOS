# No `[selftest]` block on purpose: this brick has no suite *entry*. Its three suites
# (`br_sched_selftest` / `br_sync_selftest` / `br_work_selftest`) are compiled through
# `[build].selftest_sources` and called by core's aggregator, so the image keeps **one** selftest
# driver (ADR-0010) and no suite runs twice.

[build]
sources        = ["src/*.c", "src/*.S"]
selftest_sources = ["selftest/*.c"]
includes       = ["include"]
