# tests/gates.toml — 门禁声明面(人写; `brickie test` / `brickie build` 消费)
#
# 为什么门禁要有声明面:
#   门禁的"红绿判据"以前住在顶层 `Makefile` 的 recipe 里(grep 一串模式 + 一个用例名单)。
#   那是**第二处真值**: 同一个判据在 Makefile、CI、文档里各写一遍就会漂。搬到这里之后,
#   `brickie test` 只按本文件编排, 判据由 brickie-core 应用 —— 于是 `--json`、文本输出与
#   CI 的退出码全从同一份 `data` 来。
#
# 三张表(与 `6-01-test.md` 的用例表是不同层次的东西: 那是**用例内容**, 这是**怎么跑**):
#   [[hosttest]]  宿主可执行用例(不碰交叉工具链/QEMU): 编 → 跑 → 退出码即判据
#   [[gate]]      QEMU 门禁: 限时跑镜像 → 日志按 require/forbid 正则判 + 用例 tag 点名
#   [[script]]    脚本门禁: 跑一个脚本 → 退出码 + 可选 stdout 正则
#
# ⚠ 正则子集(如实声明, 免得写出"永不匹配"的假绿): 支持 `.` `*` `+` `?` `[...]`(`^` 取反、
#   `a-z` 区间)与 `\x` 转义; **不支持**分组/交替/锚点(`( ) | ^ $ { }`)—— 写了它们
#   core 会**报形状错**(BRV-BLD-0012)而不是静默不匹配。
#   所以"三种 CONF 的 FAIL"写成三条 forbid, 而不是一条交替正则。
schema = 1

# ------------------------------------------------------------------ QEMU 运行
[run]
default_timeout_s = 5

# ------------------------------------------------------------------ 宿主用例
[host]
cc = "cc"
bin_dir = "build/hosttest"
cflags = [
  "-std=c11", "-O2", "-g", "-DBR_HOSTTEST=1",
  "-Wall", "-Wextra", "-Werror", "-Wshadow", "-Wundef", "-Wpointer-arith",
  "-Wstrict-prototypes", "-Wmissing-prototypes",
]

[[hosttest]]
name     = "sync-test"
# 同步原语的主判据: 被测 = sync.c(+ time.c 的 br_deadline_from_now + string.c),
# 桩 = sync_test.c 里的 ucontext 假调度器(真跑阻塞/唤醒/超时) + host_stubs.c。
# 自检套件(`core/selftest/sync_selftest.c`, ADR-0010)必须列进来: 宿主的退出码是
# sched/sync 的**主判据**, 套件搬出生产 .c 后不列就既缺符号(链接失败)又丢掉整套用例。
# 宿主上自检**恒在** —— 宿主测试只在开发/CI 跑, 没有需要尊重的产品开关(§2.3)。
sources  = [
  "core/src/sync/sync.c", "core/src/time.c", "core/src/string.c",
  "core/selftest/sync_selftest.c",
  "tests/host/sync_test.c", "tests/host/host_stubs.c",
]
includes = [
  "core/include", "core/src", "core/src/sched", "tests/host",
  "platform/qemu-aarch64/include",
]

[[hosttest]]
name     = "string-test"
sources  = ["core/src/string.c", "tests/host/string_test.c"]
includes = ["core/include", "core/src", "tests/host"]

[[hosttest]]
name     = "mem-test"
# 与旧 Makefile 的 `mem-test: string-test` 同义: 内存语义门禁跑之前先跑支持例程用例。
depends  = ["string-test"]
sources  = [
  "core/src/mem/tlsf.c", "core/src/mem/mem.c", "core/src/mem/page.c",
  "core/src/mm/mm.c", "tests/host/mem_test.c", "tests/host/host_stubs.c",
]
includes = ["core/include", "core/src", "core/src/mem", "core/src/mm", "tests/host"]

# sched-test(宿主): 调度框架 + **coop** 的语义门禁。
# 切换层 `core/src/sched/switch.S` **只在 aarch64 编**(宿主是 x86-64)⇒ 用例自备
# ucontext 版的 `br_sched_switch_to()` 与时钟/L2/日志/panic 桩; 共享装置在
# `tests/host/host_sched.c`(接口与理由见 host_sched.h), 本用例只放 coop 特有的判据。
# 判据两类: 宿主专用的 FIFO/block-wake/超时/sleep_until/idle,
# 加上 core 的 `br_sched_selftest()`(TC-TASK-* / TC-TIME-*, kind=coop ⇒ 跑 TC-TASK-101)。
# ★ ADR-0011 之后镜像选的是 sched/rr ⇒ **本用例是 coop 的唯一腿**(含"忙线程不被切走"
#   那条 coop/preempt 分界)。
[[hosttest]]
name     = "sched-test"
# 与内存语义门禁同样的支持例程前置(编译器可能把整块清零降低成 memset)。
depends  = ["string-test"]
# 自检套件 `core/selftest/sched_selftest.c` 的理由同上面的 sync-test(宿主是主判据,
# 套件已搬出 sched_core.c; 宿主上自检恒在)。
# `core/src/work/work_core.c` 必须一起编: sched_core.c 的 bh 禁令与 host_sched.c 的
# `br_irq_in_atomic()` 都引用 `br_work_in_bh()`。
# `core/src/trace.c` 同理: ADR-0011 之后 sched_core.c 的抢占/bh 禁令都会留痕。
sources  = [
  "core/src/sched/sched_core.c", "core/src/work/work_core.c",
  "core/src/trace.c", "core/src/string.c",
  "core/selftest/sched_selftest.c",
  "sched/coop/src/coop.c",
  "tests/host/host_sched.c", "tests/host/sched_test.c",
]
includes = ["core/include", "core/src", "core/src/sched", "sched/coop/include", "tests/host"]

# rr-test(宿主): **sched/rr**(时间片轮转抢占)的语义门禁(ADR-0011)。
# 与 sched-test 共用装置; 判据是"tick 驱动的抢占"这一族: AABB 交替序列 / 无 tick 不抢占 /
# need_resched 的置位与消费, 加上 core 的 `br_sched_selftest()`(kind=preempt ⇒ 会跑
# TC-TASK-102 时间片抢占与 TC-TASK-103 临界区不抢占)。
[[hosttest]]
name     = "rr-test"
depends  = ["string-test"]
sources  = [
  "core/src/sched/sched_core.c", "core/src/work/work_core.c",
  "core/src/trace.c", "core/src/string.c",
  "core/selftest/sched_selftest.c",
  "sched/rr/src/rr.c",
  "tests/host/host_sched.c", "tests/host/rr_test.c",
]
includes = ["core/include", "core/src", "core/src/sched", "sched/rr/include", "tests/host"]

# work-test(宿主): 下半部/工作队列的语义门禁(ADR-0011)。
# 被测 = `core/src/work/work_core.c`(+ trace 环, 用来观察 bh 禁令的留痕);
# 队列有界/FIFO/预算/非重入/bh 上下文与禁令 —— 目标上要构造"队列满"得靠中断风暴。
# 带上 sched_core.c + trace.c: 前者提供 bh 内阻塞/让出的真实禁令路径, 后者是留痕的证据源。
[[hosttest]]
name     = "work-test"
depends  = ["string-test"]
sources  = [
  "core/src/work/work_core.c", "core/src/sched/sched_core.c", "core/src/trace.c",
  "core/src/string.c",
  "sched/rr/src/rr.c",
  "tests/host/host_sched.c", "tests/host/work_test.c",
]
includes = ["core/include", "core/src", "core/src/sched", "sched/rr/include", "tests/host"]

# ft-test(宿主): **文件表(framework/file-table) + errno 值域**的门禁(ADR-0012)。
# 为什么值得一条宿主用例: 表是**纯算法**(契约头明写"不解引用 br_file_t")—— 表满 /
# dup2 顶替 / 最后一个引用 / 极端 fd 这些只有真实负载才碰得到的边界, 宿主上几毫秒全跑到,
# 不必开 QEMU(与 mem-test / sync-test 的分工同型)。
# ★ 它还兼任**errno 对拍**: 拿宿主 <errno.h> 逐码比 `br_error.h` 的每一个 BR_E* ——
#   这是"errno 与 Linux kernel 保持一致"的可执行判据(宿主 x86-64 与目标 aarch64 共用
#   内核 asm-generic 编号, 所以对目标同样成立)。
# 源集合里带上 `src/ft_selftest.c`: in-image 套件(TC-FT-001..011)在宿主上**重跑同一份**,
# 于是宿主与目标两条腿的判据同源, 不会各自漂。
[[hosttest]]
name     = "ft-test"
sources  = [
  "framework/file-table/src/file_table.c",
  "framework/file-table/src/ft_selftest.c",
  "tests/host/ft_test.c",
]
includes = ["core/include", "framework/file-table/include", "tests/host"]

# ⚠ **同名是刻意的**: `sync-test` / `sched-test` 在 `[[hosttest]]` 与 `[[gate]]` 里各有一条。
#   同一个名字指的是"同一套用例的两种跑法" —— 宿主侧(秒级、能用 ucontext 造真阻塞)与
#   目标侧(真地址空间、真中断、真 tick)。于是 `brickie test sync-test` 会**两条都跑**,
#   这正是我们要的: 宿主红与目标红是两种不同的信息, 少一个都不算验证过。
#   (判据仍各自独立: 宿主的判据是退出码, 目标的判据是 require/forbid/require_tags。)

# ------------------------------------------------------------------ QEMU 门禁
# smoke: 只看"启动 / MainLoop / 延时判据 / 中断心跳 / 三套一致性用例摘要"。
[[gate]]
name      = "smoke"
timeout_s = 3
log       = "build/logs/smoke.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "core MainLoop",
  "tick=2 ",
  # ★ 替代原 `int: conformance ALL PASS`(ADR-0010): 那行由 platform.start 打印,
  # 而中断/内存两套用例已搬到 selftest。这里直接钉 IRQCONF 的 SUMMARY ——
  # 比原判据更强(它同时断言"跑了 67 项"且"全绿", 原来那句只是 platform 的一句自述)。
  "\\[IRQCONF\\] SUMMARY pass=[0-9]+ fail=0 ",
  # ★ ADR-0011: 下半部/工作队列的套件摘要(有界/FIFO/非重入/bh 禁令)。
  "\\[WQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[MEMCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DBGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
  # 延时自检的判据行("... us: ok"): 它证明"不早醒"这条性质**被测过且通过**,
  # 而不只是"没出现失败字样"。
  "us: ok\\)",
]
forbid    = [
  # ⚠ 这里**不能**写裸词 "EARLY": 插件管理器的启动横幅里有 `(EARLY/CORE/LATE -> …)`,
  # 会误伤(实测踩到)。判据要精确到"延时自检报早醒"那一行: `... us: EARLY)`
  # —— 门禁模式必须钉在**判据本身**上, 而不是判据可能用到的词上。
  "us: EARLY\\)",
  "FATAL",
  "\\[PANIC\\]",
  "\\[IRQCONF\\] FAIL",
  "\\[WQCONF\\] FAIL",
  "\\[MEMCONF\\] FAIL",
  "\\[DBGCONF\\] FAIL",
]

# irq-test: **逐用例**门禁(裁掉用例也算红 —— 与 smoke 的分工就在这里)。
[[gate]]
name      = "irq-test"
timeout_s = 6
log       = "build/logs/irq.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[IRQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[IRQCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "GIC-EOIMODE", "GIC-PRIBITS", "GIC-LINES", "GIC-TIMERID",
  "TC-IRQ-001", "TC-IRQ-002", "TC-IRQ-003", "TC-IRQ-004", "TC-IRQ-008",
  "TC-IRQ-010", "TC-IRQ-012", "TC-IRQ-013", "TC-IRQ-014", "TC-IRQ-016",
  "TC-IRQ-018", "TC-IRQ-019", "TC-IRQ-021", "TC-IRQ-022", "TC-IRQ-101",
  "TC-IRQ-102", "TC-IRQ-STATS",
  # ★ ADR-0011 新增(下半部 bh): 015 = 按线的 BH 分发(handler 真的在 bh 上下文里);
  #   017 = §11.4.1 的抑制 / 不重放。016 本来就在名单里, 本刀把它的判据从
  #   "ISR 守卫"扩到"原子上下文(ISR **或** bh)守卫", tag 不变。
  "TC-IRQ-015", "TC-IRQ-017",
]

# dbg-test: 内存映射 + 调试插件两个摘要同时全绿, 且用例 tag 一个不缺。
[[gate]]
name      = "dbg-test"
timeout_s = 8
log       = "build/logs/dbg.log"
require   = [
  # ★ 替代原先的 `DBG-INIT` 用例(ADR-0010): 那条例外是 dump **代调**四家 LATE init 时
  # 写的本地断言; 现在 init 由 plugin_manager 驱动, 事实在**管理器的日志**里 ——
  # 于是判据直接钉在管理器自己的行上: 四个插件各自被驱动过且 init 返回 0。
  # 比原用例更强: 它同时证明"被驱动"(而 DBG-INIT 只证明"dump 调过")。
  "\\[PLUGIN\\] phase=late name=service/trace rc=0",
  "\\[PLUGIN\\] phase=late name=service/backtrace rc=0",
  "\\[PLUGIN\\] phase=late name=service/hexdump rc=0",
  "\\[PLUGIN\\] phase=late name=service/memleak rc=0",
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[MEMCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DBGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[MEMCONF\\] FAIL",
  "\\[DBGCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "MM-ACTIVE", "MM-IDENT", "MM-POOLS", "MM-REGION", "MM-RO", "MM-NXDESC", "MM-UNMAP",
  "TC-MEM-001", "TC-MEM-002", "TC-MEM-003", "TC-MEM-004", "TC-MEM-005",
  "TC-MEM-006", "TC-MEM-007", "TC-MM-001", "TC-MM-002", "TC-MM-003",
  "TC-DBG-001", "TC-DBG-002", "TC-DBG-003", "TC-DBG-010", "TC-DBG-011",
  "TC-DBG-020", "TC-DBG-021", "TC-DBG-030", "TC-DBG-031", "TC-DBG-032",
  "TC-DBG-040", "TC-DBG-041", "TC-DBG-042", "TC-DBG-043", "TC-DBG-100",
]

# ------------------------------------------------------------------ 脚本门禁
# 这三条是"机械判据"(反汇编扫描 / 登记表 ↔ 源码标记一致性 / 构建接线), 逻辑本身
# 就是脚本 —— 由 brickie 编排(而不是由 Makefile 编排)才是本表的重点。
[[script]]
name    = "check-string"
argv    = ["bash", "tools/check-string.sh", "build/obj/core/src/string.o"]
require = ["ok   编译器支持例程无自递归"]

[[script]]
name    = "check-headers"
argv    = ["bash", "tools/check-headers.sh"]
require = ["ok   [0-9]* 个对外头"]

[[script]]
name = "check-workarounds"
argv = ["bash", "tools/check-workarounds.sh"]

[[script]]
name = "check-build"
argv = ["bash", "tools/check-build.sh"]

# sync-test: 同步原语的端到端门禁(线程 + 阻塞 + 超时, 在 QEMU 上)。
# 依赖 F2 的调度框架与 F1 把 br_sync_selftest() 接到 APP 的 start 里;
# 框架未注册时 sync.c 只打 SKIP + 部分 tag ⇒ 本门禁**如实判红**(不放宽判据)。
[[gate]]
name      = "sync-test"
timeout_s = 8
log       = "build/logs/sync.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[SYNCCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[SYNCCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-SYNC-001", "TC-SYNC-002", "TC-SYNC-003", "TC-SYNC-004", "TC-SYNC-005",
  "TC-SYNC-006", "TC-SYNC-007", "TC-SYNC-008", "TC-SYNC-009",
  "TC-TIME-001", "TC-TIME-002", "TC-TIME-003",
]

# plugin-test: 插件管理器 + 服务注册表的端到端门禁(在 QEMU 上)。
# 判据 = `[PLGCONF]`(段条数/拓扑序/相位单调/环检测负例)与 `[SVCCONF]`(注册表)两族摘要
# 全绿, 且 `irq_ticks` 非 0(证明 START 相之后的 timer 心跳真的在跑 —— 即"插件管理器确实
# 驱动了 platform 的 start, 而不是把它省掉")。
# 注意: 相名与 tag 正则都在本文件的正则子集内(无分组/交替/锚点); `[PLGCONF] FAIL` 与
# `[PANIC]` 是禁止模式 —— 首败即停机会打 [PANIC], 与本门禁的红一致。
[[gate]]
name      = "plugin-test"
timeout_s = 8
log       = "build/logs/plugin.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[PLGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[SVCCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # ★ ADR-0012: 文件表(fd 表)的一致性套件。它与 PLGCONF/SVCCONF 同属"插件基础设施"
  #   ——都跑在 core 的自检 pass 里, 所以挂在本门禁下而不是另开一次 QEMU。
  #   宿主腿是独立的 `ft-test`(含 errno 与内核逐码对拍)。
  "\\[FTCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[PLGCONF\\] FAIL",
  "\\[SVCCONF\\] FAIL",
  "\\[FTCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-PLUG-001", "TC-PLUG-002", "TC-PLUG-003", "TC-PLUG-002b",
  "TC-SVC-001", "TC-SVC-002", "TC-SVC-003",
  # 文件表逐条点名(裁掉用例也算红 —— 与 smoke 的分工就在这里)。
  "TC-FT-001", "TC-FT-002", "TC-FT-003", "TC-FT-004", "TC-FT-005", "TC-FT-006",
  "TC-FT-007", "TC-FT-008", "TC-FT-009", "TC-FT-010", "TC-FT-011",
]

# sched-test(QEMU): 调度框架 + coop 的端到端门禁。
# 依赖 F1 把 APP 的 start() 改成"创建 APP 线程"(于是插件管理器在全部 start 之后
# 进 `br_sched_run()`)并把 `br_sched_selftest()` 接在 APP 线程里; 未接线时镜像里
# 没有 `[TASKCONF]` 输出 ⇒ 本门禁**如实判红**(不放宽判据)。
# `irq_ticks=[1-9]` 是"START 相之后的 timer 心跳真的在跑"的证据, 也保证超时扫描有 tick 源。
[[gate]]
name      = "sched-test"
timeout_s = 8
log       = "build/logs/sched.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[TASKCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # ★ ADR-0011: 下半部在工作队列里的可观测证据(这一镜像是 preempt 调度器)。
  "\\[WQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[TASKCONF\\] FAIL",
  "\\[WQCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-TASK-001", "TC-TASK-002", "TC-TASK-003", "TC-TASK-004", "TC-TASK-005",
  "TC-TASK-006", "TC-TASK-007", "TC-TASK-104",
  # ★ ADR-0011: 镜像的调度器是 sched/rr(preempt)⇒ 目标侧跑的是**抢占**那两条
  #   (TC-TASK-102 时间片 / TC-TASK-103 临界区不抢占); coop 的反面判据 TC-TASK-101
  #   由宿主的 sched-test(coop)覆盖 —— 两边各跑自己那一面, 没有一条被裁掉。
  "TC-TASK-102", "TC-TASK-103",
  "TC-TIME-001", "TC-TIME-002", "TC-TIME-003",
]

# fs-test: 存储/设备域端到端门禁(ADR-0009)。
# 判据 = 四套新用例摘要全绿 + 挂载证据 + 设备真的被投影出来:
#   [VFSCONF] 存储域总套件(挂载表/走查链/文件面/目录面, APP 的 start 调)
#   [DEVCONF] 通用设备注册表(framework/dev-core 的 start)
#   [CDEVCONF] 字符设备子分类与适配层(framework/cdev-core 的 start)
#   [IOCONF]  PL011 器件经 /dev/uart0 的完整往返(io/uart-pl011 的 start)
# `vfs: mount /` 与 `vfs: mount /dev` 是"挂载计划真的执行了"的证据(不是只看摘要);
# `irq_ticks` 非 0 保证这一切发生在中断已开的 START 相之后。
[[gate]]
name      = "fs-test"
timeout_s = 10
log       = "build/logs/fs.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿。★ 这条**不是**"没有 FAIL 字样就算过", 而是
  # 要求 SUMMARY 行真的在(ran >= 1)且 fails=0/errors=0 —— 于是它同时证明两件事:
  # 自检被驱动过, 且开关是打开的(关掉自检的镜像里这一行根本不存在)。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "vfs: mount / ",
  "vfs: mount /dev ",
  "\\[VFSCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[CDEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[IOCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[VFSCONF\\] FAIL",
  "\\[DEVCONF\\] FAIL",
  "\\[CDEVCONF\\] FAIL",
  "\\[IOCONF\\] FAIL",
  "\\[PANIC\\]",
]
# 用例 tag 逐条点名(裁掉用例也算红 —— 与 smoke 的分工)。
require_tags = [
  "TC-VFS-001", "TC-VFS-002", "TC-VFS-003", "TC-VFS-004", "TC-VFS-005",
  "TC-VFS-006", "TC-VFS-007", "TC-VFS-008", "TC-VFS-009", "TC-VFS-010",
  "TC-VFS-011", "TC-VFS-012", "TC-VFS-013",
  # ★ ADR-0013 新增(链接族): 符号链接的展开在 vfs-core, 硬链接的共享数据体在 FS。
  "TC-VFS-014", "TC-VFS-015", "TC-VFS-016", "TC-VFS-017", "TC-VFS-018",
  "TC-VFS-019", "TC-VFS-020",
  "TC-DEV-001", "TC-DEV-002", "TC-DEV-003", "TC-DEV-004", "TC-DEV-005", "TC-DEV-006",
  "TC-CDEV-001", "TC-CDEV-002", "TC-CDEV-003", "TC-CDEV-004", "TC-CDEV-005",
  "TC-CDEV-006", "TC-CDEV-007", "TC-CDEV-008",
  "TC-IO-001", "TC-IO-002", "TC-IO-003", "TC-IO-004", "TC-IO-005", "TC-IO-006",
  "TC-IO-007", "TC-IO-008", "TC-IO-009", "TC-IO-010", "TC-IO-011", "TC-IO-012",
]

# posix-test: **runtime/posix 的 POSIX 面**端到端门禁(ADR-0014/0015)。
# 判据 = `[POSIXCONF]` 摘要全绿 + 20 个 tag 逐条点名 + 启动证据行。这一关的意义与
# fs-test 不同: fs-test 测的是**框架件契约**(VFSCONF 只经 native API), 本关测的是
# **POSIX 面本身**(用例只 include POSIX 头, 一行 br_* 都不调)—— 名字/签名/错误通道
# (系统调用 -1+errno vs pthread 返回错误号)正是最容易出错的地方。
[[gate]]
name      = "posix-test"
timeout_s = 25
log       = "build/logs/posix.log"
require   = [
  # ADR-0010: 自检 pass 存在且全绿(同时证明"自检被驱动过"与"开关是打开的")。
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "runtime/posix: POSIX 运行时就绪",
  "\\[POSIXCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[POSIXCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-POSIX-001", "TC-POSIX-002", "TC-POSIX-003", "TC-POSIX-004", "TC-POSIX-005",
  "TC-POSIX-006", "TC-POSIX-007", "TC-POSIX-008", "TC-POSIX-009", "TC-POSIX-010",
  "TC-POSIX-011", "TC-POSIX-012", "TC-POSIX-013", "TC-POSIX-014", "TC-POSIX-015",
  "TC-POSIX-016", "TC-POSIX-017", "TC-POSIX-018", "TC-POSIX-019", "TC-POSIX-020",
]

# ------------------------------------------------------------------ 构建后门禁
[build]
# `brickie build` 成功后**自动**跑的短名单(与旧 Makefile 的 `all: … check-string` 同义)。
# 放在脚本门禁里而不是编进编译流程, 是因为它是**判据**而不是构建步骤。
post = ["check-string", "check-headers"]
