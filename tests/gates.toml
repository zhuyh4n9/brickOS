# tests/gates.toml — gate declaration surface (hand-written; consumed by `brickie test` / `brickie build`)
#
# Why gates need a declaration surface:
#   The red/green criterion used to live in top-level `Makefile` recipes (grep a set of patterns + a test list).
#   That was a **second source of truth**: written again in Makefile, CI and docs, it drifts. Moved here,
#   `brickie test` orchestrates purely from this file and brickie-core applies the criteria — so `--json`,
#   text output and CI exit codes all come from one `data`.
#
# Three tables (a different layer from `6-01-test.md`'s case table: that is **case content**, this is **how to run**):
#   [[hosttest]]  host executables (no cross toolchain/QEMU): build -> run -> exit code is the criterion
#   [[gate]]      QEMU gate: run the image under a timeout -> judge log by require/forbid regex + tags
#   [[script]]    script gate: run a script -> exit code + optional stdout regex
#
# ! Regex subset (declared honestly, to avoid "never matches" false green): supports `.` `*` `+` `?` `[...]`
#   (`^` negation, `a-z` ranges) and `\x` escapes; **not** supported: grouping/alternation/anchors
#   (`( ) | ^ $ { }`) — core reports a **shape error** (BRV-BLD-0012) instead of silently not matching.
#   Hence "FAIL of three CONFs" is three forbid entries, not one alternation regex.
schema = 1

# ------------------------------------------------------------------ QEMU run
[run]
default_timeout_s = 5

# ------------------------------------------------------------------ host tests
[host]
cc = "cc"
bin_dir = "build/hosttest"
cflags = [
  "-std=c11", "-O2", "-g", "-DBR_HOSTTEST=1",
  "-Wall", "-Wextra", "-Werror", "-Wshadow", "-Wundef", "-Wpointer-arith",
  "-Wstrict-prototypes", "-Wmissing-prototypes",
]

[[hosttest]]
name     = "sync-test"
# Main criterion for sync primitives: under test = sync.c (+ time.c's br_deadline_from_now + string.c),
# stubs = ucontext fake scheduler in sync_test.c (really runs block/wake/timeout) + host_stubs.c.
# The selftest suite (`core/c_core/selftest/sync_selftest.c`, ADR-0010) must be listed: the host exit code is
# sched/sync's **main criterion**; omitting the suite (moved out of the production .c) both breaks the
# link and drops the whole case set. On host, selftest is **always on** — host tests run only in dev/CI,
sources  = [
  "core/c_core/src/sync/sync.c", "core/c_core/src/time.c", "core/c_core/src/string.c",
  "core/c_core/selftest/sync_selftest.c",
  "tests/host/sync_test.c", "tests/host/host_stubs.c",
]
includes = [
  "core/c_core/include", "core/c_core/src", "core/c_core/src/sched", "tests/host",
  "platform/qemu-aarch64/include",
]

[[hosttest]]
name     = "string-test"
sources  = ["core/c_core/src/string.c", "tests/host/string_test.c"]
includes = ["core/c_core/include", "core/c_core/src", "tests/host"]

[[hosttest]]
name     = "mem-test"
# Same as the old Makefile's `mem-test: string-test`: run the support-routine case before the mem gate.
depends  = ["string-test"]
sources  = [
  "core/c_core/src/mem/tlsf.c", "core/c_core/src/mem/mem.c", "core/c_core/src/mem/page.c",
  "core/c_core/src/mm/mm.c", "tests/host/mem_test.c", "tests/host/host_stubs.c",
]
includes = ["core/c_core/include", "core/c_core/src", "core/c_core/src/mem", "core/c_core/src/mm", "tests/host"]

# sched-test (host): semantic gate for the scheduler framework + **coop**.
# The switch layer `core/c_core/src/sched/switch.S` builds **only on aarch64** (host is x86-64) => the case brings
# its own ucontext `br_sched_switch_to()` plus clock/L2/log/panic stubs; shared rig in
# `tests/host/host_sched.c` (interface/rationale in host_sched.h); this case holds coop-specific criteria.
# Two criterion families: host-only FIFO/block-wake/timeout/sleep_until/idle,
# plus core's `br_sched_selftest()` (TC-TASK-* / TC-TIME-*, kind=coop => runs TC-TASK-101).
# * After ADR-0011 the image selects sched/rr => **this case is coop's only leg** (including "a busy
#   thread is not preempted").
[[hosttest]]
name     = "sched-test"
# Same support-routine prerequisite as the mem gate (the compiler may lower a block clear to memset).
depends  = ["string-test"]
# The `core/c_core/selftest/sched_selftest.c` suite is listed for the same reason as sync-test above (host is the
# main criterion; the suite moved out of sched_core.c; selftest is always on host).
# `core/c_core/src/work/work_core.c` must be compiled too: sched_core.c's bh ban and host_sched.c's
# `br_irq_in_atomic()` both reference `br_work_in_bh()`.
# Same for `core/c_core/src/trace.c`: after ADR-0011 sched_core.c's preempt/bh bans leave traces.
sources  = [
  "core/c_core/src/sched/sched_core.c", "core/c_core/src/work/work_core.c",
  "core/c_core/src/trace.c", "core/c_core/src/string.c",
  "core/c_core/selftest/sched_selftest.c",
  "sched/coop/src/coop.c",
  "tests/host/host_sched.c", "tests/host/sched_test.c",
]
includes = ["core/c_core/include", "core/c_core/src", "core/c_core/src/sched", "sched/coop/include", "tests/host"]

# rr-test (host): semantic gate for **sched/rr** (round-robin preemption) (ADR-0011).
# Shares the rig with sched-test; criteria are the "tick-driven preemption" family: AABB alternation / no
# preemption without a tick / need_resched set-and-consume, plus core's `br_sched_selftest()`
# (kind=preempt => runs TC-TASK-102 slice preemption and TC-TASK-103 no preempt in critical section).
[[hosttest]]
name     = "rr-test"
depends  = ["string-test"]
sources  = [
  "core/c_core/src/sched/sched_core.c", "core/c_core/src/work/work_core.c",
  "core/c_core/src/trace.c", "core/c_core/src/string.c",
  "core/c_core/selftest/sched_selftest.c",
  "sched/rr/src/rr.c",
  "tests/host/host_sched.c", "tests/host/rr_test.c",
]
includes = ["core/c_core/include", "core/c_core/src", "core/c_core/src/sched", "sched/rr/include", "tests/host"]

# work-test (host): semantic gate for bottom halves / work queues (ADR-0011).
# Under test = `core/c_core/src/work/work_core.c` (+ trace ring, to observe bh-ban traces);
# queue bounded/FIFO/budget/non-reentrant/bh context and bans — on target a full queue needs an IRQ storm.
# Include sched_core.c + trace.c: the former gives the real ban path for blocking/yielding in bh, the latter
[[hosttest]]
name     = "work-test"
depends  = ["string-test"]
sources  = [
  "core/c_core/src/work/work_core.c", "core/c_core/src/sched/sched_core.c", "core/c_core/src/trace.c",
  "core/c_core/src/string.c",
  "sched/rr/src/rr.c",
  "tests/host/host_sched.c", "tests/host/work_test.c",
]
includes = ["core/c_core/include", "core/c_core/src", "core/c_core/src/sched", "sched/rr/include", "tests/host"]

# ft-test (host): gate for the **file table (framework/file-table) + errno value range** (ADR-0012).
# Why a host case is worthwhile: the table is a **pure algorithm** (contract header says "never dereferences
# br_file_t") — table full / dup2 replacement / last reference / extreme fd are boundaries only real load
# reaches, and the host covers them in milliseconds without QEMU (same split as mem-test / sync-test).
# * It also serves as the **errno cross-check**: compare every BR_E* in `br_error.h` code by code against
#   host <errno.h> — an executable criterion for "errno matches the Linux kernel" (host x86-64 and target
#   aarch64 share the asm-generic numbering, so it holds for the target too).
# The source set includes `src/ft_selftest.c`: the in-image suite (TC-FT-001..011) **reruns verbatim** on
# the host, so both legs share one criterion source and cannot drift apart.
[[hosttest]]
name     = "ft-test"
sources  = [
  "framework/file-table/src/file_table.c",
  "framework/file-table/src/ft_selftest.c",
  "tests/host/ft_test.c",
]
includes = ["core/c_core/include", "framework/file-table/include", "tests/host"]

# ! **Duplicate names are deliberate**: `sync-test` / `sched-test` appear in both `[[hosttest]]` and `[[gate]]`.
#   One name means "two ways to run one case set" — host side (seconds, real blocking via ucontext) and
#   target side (real address space, real IRQs, real tick). So `brickie test sync-test` **runs both**,
#   which is what we want: host-red and target-red are different information; neither alone is verification.
#   (Criteria stay independent: host = exit code, target = require/forbid/require_tags.)

# ------------------------------------------------------------------ QEMU gates
# smoke: only "boot / MainLoop / delay criterion / IRQ heartbeat / each conformance suite summary".
# * ADR-0022 raised the timeout from 3 s to 12 s: this cut adds two media-class FS, and the start phase
#   reads ~80 KiB over real SDHCI (the 70000 B compressed + 4096 B flat fixtures etc.), one sector per
#   read (the driver's strongest claim: one I/O sector <= max_rw); selftest phase went ~0.2 s -> ~1.5 s.
#   Also `tick=2 ` itself waits for two 1 s heartbeats => 3 s no longer suffices (measured: the selftest
#   SUMMARY landed at exactly 2.97 s, so tick=2 never made it).
#
# ------------------------------------------------------------------ how the QEMU gate timeouts are chosen
# * Chosen from **measured headroom**, not by feel (measured 2026-10-13): every QEMU gate runs the
#   *same* image, and the selftest pass finishes (`[SELFTEST] SUMMARY`) at **~5.6-5.7 s** of guest time
#   (`ran=18 skipped=6 fails=0`; five gates measured -- smoke/irq/sync/sched/fs -- all in 5.57-5.71 s).
#   But an occasional multi-second stall does happen (the known `br-wa-boot-002`: the selftest pass runs
#   concurrently with threads started in the start phase, and when device access collides an SDHCI
#   command waits out its full timeout -- observed as a single ~2 s wait in the log), so completion can
#   drift past 8 s.
#   Hence the old 6/8/10 s tiers **truncated the log intermittently**, with a confusing symptom: **no
#   FAIL at all**, just a missing `[SELFTEST] SUMMARY` plus a batch of `require_tags` (the criteria then
#   read as "N unsatisfied").
#   => give **20 s** uniformly (~3.5x headroom; same reasoning as the 30 s device-class gates).
#   * If a gate ever really hangs, 20 s is only 14 s slower than 6 s -- cheap insurance against a false red.
[[gate]]
name      = "smoke"
timeout_s = 20
log       = "build/logs/smoke.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "core MainLoop",
  "tick=2 ",
  # * Replaces the old `int: conformance ALL PASS` (ADR-0010): that line was printed by platform.start,
  # while the IRQ/memory suites moved into selftest. Here we pin IRQCONF's SUMMARY directly —
  # stronger than before (asserts both "67 cases ran" and "all green"; the old line was self-reported).
  "\\[IRQCONF\\] SUMMARY pass=[0-9]+ fail=0 ",
  # * ADR-0011: bottom-half/work-queue suite summary (bounded/FIFO/non-reentrant/bh bans).
  "\\[WQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[MEMCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DBGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0021: block-device subclass (bdev-core) suite summary — framework part of the 2nd device chain.
  #   Before a driver joins, TC-BDEV-006/008 take the "not applicable" branch; the framework mechanisms
  "\\[BDEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0021 D-2: generic PCI(e) framework suite summary (sdhci-pci enumerated, BARs assigned,
  #   command register with MEM/BUS_MASTER set, INTx swizzle correct).
  "\\[PCICONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0019: APP-side POSIX multithreading sample (through the iface/posix skin). It proves threads
  #   really ran on a real image with all green, not just runtime/posix's own selftest.
  "\\[APPCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0022: suite summary of the two **media-class filesystem** ports (FAT12/16/32 volumes + EROFS image).
  #   Split vs. the entries above: here is the **coarse criterion** "volumes mounted and cases green";
  #   per-case naming and "bytes made by an external authority tool read back correctly" are judged in detail
  "\\[FATCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[EROFCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
  # The delay-selftest criterion line ("... us: ok"): proves the "no early wake" property was **tested and**
  # **passed**, not merely that no failure string appeared.
  "us: ok\\)",
]
forbid    = [
  # ! A bare "EARLY" **must not** be used here: the plugin manager's boot banner contains
  # `(EARLY/CORE/LATE -> ...)`, a false hit in practice. Pin the criterion to the delay-selftest line:
  # `... us: EARLY)` — gate patterns must pin **the criterion itself**, not words it may use.
  "us: EARLY\\)",
  "FATAL",
  "\\[PANIC\\]",
  "\\[IRQCONF\\] FAIL",
  "\\[WQCONF\\] FAIL",
  "\\[MEMCONF\\] FAIL",
  "\\[DBGCONF\\] FAIL",
  "\\[BDEVCONF\\] FAIL",
  "\\[PCICONF\\] FAIL",
  "\\[APPCONF\\] FAIL",
  "\\[FATCONF\\] FAIL",
  "\\[EROFCONF\\] FAIL",
]
require_tags = [
  # ADR-0019: name each case — if an APP multithreading case is trimmed/skipped the gate goes red.
  "APP-PT-001", "APP-PT-002", "APP-PT-003", "APP-PT-004",
  "APP-PT-005", "APP-PT-006", "APP-PT-007",
  # * ADR-0022: APP-side media-class filesystem cases (through iface/posix), named individually.
  "APP-FS-001", "APP-FS-002", "APP-FS-003", "APP-FS-004",
  "APP-FS-005", "APP-FS-006", "APP-FS-007",
  # * ADR-0021 D-2: PCIe framework cases named individually (trimming one is red too).
  "TC-PCI-001", "TC-PCI-002", "TC-PCI-003", "TC-PCI-004",
  "TC-PCI-005", "TC-PCI-006", "TC-PCI-007", "TC-PCI-008",
]

# irq-test: **per-case** gate (trimming a case is red too — that is the split from smoke).
# * the old 6 s budget only reached ~5.2 s of guest time, i.e. it cut the log mid-selftest (same
#   confusing symptom as above: no FAIL at all, just missing `[SELFTEST] SUMMARY` / `require_tags`).
#   Measured: 6 s => truncated 3/3 times; 20 s => completes, `[TASKCONF] SUMMARY pass=14 fail=0`.
[[gate]]
name      = "irq-test"
timeout_s = 20
log       = "build/logs/irq.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[IRQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[IRQCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "GIC-EOIMODE", "GIC-PRIBITS", "GIC-LINES", "GIC-TIMERID",
  "TC-IRQ-001", "TC-IRQ-002", "TC-IRQ-003", "TC-IRQ-004", "TC-IRQ-008",
  "TC-IRQ-010", "TC-IRQ-012", "TC-IRQ-013", "TC-IRQ-014", "TC-IRQ-016",
  "TC-IRQ-018", "TC-IRQ-019", "TC-IRQ-021", "TC-IRQ-022", "TC-IRQ-101",
  "TC-IRQ-102", "TC-IRQ-STATS",
  # * ADR-0011 additions (bottom-half bh): 015 = per-line BH dispatch (handler really in bh context);
  #   017 = §11.4.1 suppression / no replay. 016 was already listed; this cut widened its criterion
  #   from "ISR guard" to "atomic context (ISR **or** bh) guard", tag unchanged.
  "TC-IRQ-015", "TC-IRQ-017",
]

# dbg-test: memory-mapping and debug-plugin summaries both all green, with no case tag missing.
[[gate]]
name      = "dbg-test"
timeout_s = 20
log       = "build/logs/dbg.log"
require   = [
  # * Replaces the old `DBG-INIT` case (ADR-0010): that exception asserted things about dump **calling on**
  # behalf of four LATE inits; now plugin_manager drives init, so the fact lives in **the manager's log** —
  # the criterion pins the manager's own lines: each of the four plugins was driven and init returned 0.
  # Stronger: it proves "was driven" (DBG-INIT only proved "dump called it").
  "\\[PLUGIN\\] phase=late name=service/trace rc=0",
  "\\[PLUGIN\\] phase=late name=service/backtrace rc=0",
  "\\[PLUGIN\\] phase=late name=service/hexdump rc=0",
  "\\[PLUGIN\\] phase=late name=service/memleak rc=0",
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[MEMCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DBGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[MEMCONF\\] FAIL",
  "\\[DBGCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "MM-ACTIVE", "MM-IDENT", "MM-POOLS", "MM-REGION", "MM-RO", "MM-NXDESC", "MM-UNMAP",
  "TC-MEM-001", "TC-MEM-002", "TC-MEM-003", "TC-MEM-004", "TC-MEM-005",
  "TC-MEM-006", "TC-MEM-007", "TC-MM-001", "TC-MM-002", "TC-MM-003",
  "TC-DBG-001", "TC-DBG-002", "TC-DBG-003", "TC-DBG-010", "TC-DBG-011",
  "TC-DBG-020", "TC-DBG-021", "TC-DBG-030", "TC-DBG-031", "TC-DBG-032",
  "TC-DBG-040", "TC-DBG-041", "TC-DBG-042", "TC-DBG-043", "TC-DBG-100",
]

# ------------------------------------------------------------------ script gates
# These three are "mechanical criteria" (disassembly scan / registry <-> source-marker consistency /
# build wiring); the logic *is* a script — that brickie orchestrates it (not the Makefile) is the point.
[[script]]
name    = "check-string"
argv    = ["bash", "tools/check-string.sh", "build/obj/core/c_core/src/string.o"]
require = ["ok   compiler support routines have no self-recursion"]

[[script]]
name    = "check-headers"
argv    = ["bash", "tools/check-headers.sh"]
require = ["ok   [0-9]* public headers"]

# check-errno: errno single-source-of-truth gate (ADR-0023).
# * It guards a rule established this cut: **POSIX error-code names belong to core** (`br/core/br_errno.h`),
#   so (1) POSIX numbers exist with or without `runtime/posix`; (2) third-party ports need not each copy a
#   mapping (a second truth and a needless upstream edit). Three criteria: name/value pairing / full coverage
[[script]]
name    = "check-errno"
argv    = ["bash", "tools/check-errno.sh"]
require = ["ok   errno table"]

[[script]]
name = "check-workarounds"
argv = ["bash", "tools/check-workarounds.sh"]

# check-third-party-pristine: gate that third_party is a **read-only vendor tree** (ADR-0025 / ADR-0026).
# * It guards the "third-party code and brickOS code must be isolated" policy, made **machine-decidable**:
#   (1) lock metadata complete; (2) vendor tree **byte-equal to the sha256 in the lock** (any byte changed => red);
#   (3) every lock entry is on disk (missing => red); (4) no files outside the lock in the vendor tree (red);
#   (5) no brick.toml under third_party/; (6) nobody includes third-party headers by **absolute path**
#   (since ADR-0026 vendor `.c` files **really are compiled** — each brick.toml's `sources` points at
#   them; vendor headers come in via relative-path **forwarding shells** in adapter/*/compat/).
#   * Why it must exist: the previous round repeatedly "edited one line of third-party code to make it
#     build" (comments/SPDX, include edits, trimming). Prose discipline does not stop it; a hash lock does.
#   * Its **other half** (ADR-0029): `check-adapter-copies` guards "no vendor source copies under adapter/".
# check-posix-conformance: gate that iface/posix **matches POSIX** (ADR-0028).
# * It guards "the POSIX surface APP sees must match real POSIX" — mismatch does not fail the build, it
#   gives **silent wrong values** (different type widths => different layout), **different flag-bit meanings**
#   (different constants), or **ported code that will not build** (a required name missing). All four
#   criteria compare against host glibc: (1) type widths (2) constant values (3) function signatures
#   * Field offsets are **not** compared: POSIX does not fix struct stat member order, so using glibc
#     offsets would mistake glibc's ABI for a POSIX requirement. Few deliberate deviations: whitelist + reason.
# check-mount-ownership: **mount ownership** gate (ADR-0030).
# * It guards the new split "mounting is decided by APP": FS plugins only register **drivers** (fstype name
#   -> ops); APP mounts by name via POSIX mount() with the plan in APP's own [[mount]].
#   Two mechanical criteria: (1) nobody in fs/ or adapter/ calls br_mount_register (no self-mounting);
#   (2) [[mount]] appears only in app/ declarations (the plan belongs to the consumer) — plus a positive
#   criterion: APP's [[mount]] must really be generated into an executable entry (mount_plan_apply).
#   * Why mechanical: if someone writes br_mount_register in an FS again, functional tests **still mount**,
#     it just becomes the FS's own decision again — nobody would notice (exactly the pre-ADR-0030 state).
[[script]]
name = "check-mount-ownership"
argv = ["bash", "tools/check-mount-ownership.sh"]
require = ["PASS: mount ownership correct"]

[[script]]
name = "check-posix-conformance"
argv = ["bash", "tools/check-posix-conformance.sh"]
require = ["PASS: iface/posix matches POSIX"]

[[script]]
name = "check-third-party-pristine"
argv = ["bash", "tools/check-third-party-pristine.sh"]
require = ["PASS: third_party is a read-only vendor tree"]

# check-adapter-copies: gate that **adapter/ carries no third-party source copies** (ADR-0026 D-3 / ADR-0029).
# * It guards the **other half** of third-party discipline: `check-third-party-pristine` watches the vendor
#   side ("not one byte of the original changed"), while "**copy upstream into adapter/ and rename**" looks
#   identical on disk to "writing an adaptation layer" — the previous round's `adapter/uboot-fat/src/
#   fat_core.c` had 0.58 line-level similarity to upstream `fs/fat/fat.c`. Criterion (after normalizing
#   away blank/comment-only/preprocessor lines, using `difflib` line similarity): any adapter .c/.h vs. any
#   vendor .c/.h with **>= 0.30 and both >= 30 lines** => red, unless **named and justified** in the
#   script (an exemption is bookkeeping, not silencing). Measured: the two pre-migration `src/fat_*.c`
[[script]]
name = "check-adapter-copies"
argv = ["python3", "tools/check-adapter-copies.py"]
require = ["PASS: adapter has no third-party source copies"]

[[script]]
name = "check-build"
argv = ["bash", "tools/check-build.sh"]

# fs-images: create the **four** block-device backing images (ADR-0022).
# * It is also listed in `[build].post` => after every `brickie build` (and `brickie test`'s auto build)
#   and before any QEMU gate, `build/emmc0..3.img` is in place. This solves two things:
#     (1) engineering fact: QEMU does not create block-device backing files itself;
#     (2) criterion provenance: FAT/EROFS volumes must be made by **external authority tools** (mkfs.fat /
#         mkfs.erofs); a homegrown mkfs mirroring a homegrown reader proves nothing.
#   * The script **rebuilds every time** (unlike the old idempotent emmc-image skip): volumes hold live FS
#     state, and what the last QEMU run wrote must vanish or rw criteria get polluted by history.
#   * Tool candidate order matches the cross toolchain: `prebuilts/toolchain/` -> PATH (versions in
[[script]]
name    = "fs-images"
argv    = ["bash", "tools/mk-fs-images.sh", "build"]
require = ["ok   fs images"]

# sync-test: end-to-end gate for sync primitives (threads + blocking + timeout, on QEMU).
# Depends on F2's scheduler framework and on F1 wiring br_sync_selftest() into APP's start;
# with no framework registered sync.c only prints SKIP + some tags => this gate **honestly goes red**
[[gate]]
name      = "sync-test"
timeout_s = 20
log       = "build/logs/sync.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[SYNCCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[SYNCCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-SYNC-001", "TC-SYNC-002", "TC-SYNC-003", "TC-SYNC-004", "TC-SYNC-005",
  "TC-SYNC-006", "TC-SYNC-007", "TC-SYNC-008", "TC-SYNC-009",
  "TC-TIME-001", "TC-TIME-002", "TC-TIME-003",
]

# plugin-test: end-to-end gate for the plugin manager + service registry (on QEMU).
# Criteria = the two summary families `[PLGCONF]` (section count/topological order/phase monotonicity/cycle
# negative) and `[SVCCONF]` (registry) all green, plus non-zero `irq_ticks` (proves the timer heartbeat
# after the START phase really runs — i.e. "the plugin manager did drive platform's start").
# Note: phase names and tag regexes stay inside this file's regex subset (no groups/alternation/anchors);
# `[PLGCONF] FAIL` and `[PANIC]` are forbidden patterns — a first-failure panic prints [PANIC], matching
[[gate]]
name      = "plugin-test"
timeout_s = 20
log       = "build/logs/plugin.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[PLGCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[SVCCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0012: the file-table (fd table) conformance suite. It and PLGCONF/SVCCONF are both "plugin
  #   infrastructure", both run in core's selftest pass, so it hangs off this gate instead of another QEMU run.
  #   The host leg is the separate `ft-test` (incl. errno cross-check against the kernel).
  "\\[FTCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[PLGCONF\\] FAIL",
  "\\[SVCCONF\\] FAIL",
  "\\[FTCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-PLUG-001", "TC-PLUG-002", "TC-PLUG-003", "TC-PLUG-002b",
  "TC-SVC-001", "TC-SVC-002", "TC-SVC-003",
  # File-table cases named individually (trimming one is red too — that is the split from smoke).
  "TC-FT-001", "TC-FT-002", "TC-FT-003", "TC-FT-004", "TC-FT-005", "TC-FT-006",
  "TC-FT-007", "TC-FT-008", "TC-FT-009", "TC-FT-010", "TC-FT-011",
]

# sched-test (QEMU): end-to-end gate for the scheduler framework + coop.
# Depends on F1 changing APP's start() to "create the APP thread" (so the plugin manager enters
# `br_sched_run()` after all starts) and wiring `br_sched_selftest()` into the APP thread; unwired, the image
# has no `[TASKCONF]` output => this gate **honestly goes red** (criteria are not relaxed).
# `irq_ticks=[1-9]` evidences "the timer heartbeat really runs after START" and gives timeout scanning a tick source.
[[gate]]
name      = "sched-test"
timeout_s = 20
log       = "build/logs/sched.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "\\[TASKCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0011: observable evidence of bottom halves in the work queue (this image has a preempt scheduler).
  "\\[WQCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[TASKCONF\\] FAIL",
  "\\[WQCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-TASK-001", "TC-TASK-002", "TC-TASK-003", "TC-TASK-004", "TC-TASK-005",
  "TC-TASK-006", "TC-TASK-007", "TC-TASK-104",
  # * ADR-0011: the image scheduler is sched/rr (preempt) => the target runs the **preemption** pair
  #   (TC-TASK-102 time slice / TC-TASK-103 no preempt in critical section); coop's opposite criterion
  #   TC-TASK-101 is covered by the host sched-test (coop) — each side runs its own face, none trimmed.
  "TC-TASK-102", "TC-TASK-103",
  "TC-TIME-001", "TC-TIME-002", "TC-TIME-003",
]

# fs-test: storage/device domain end-to-end gate (ADR-0009).
# Criteria = four new suite summaries all green + mount evidence + devices really projected:
#   [VFSCONF] storage-domain suite (mount table/walk chain/file surface/dir surface, called by APP start)
#   [DEVCONF] generic device registry (framework/dev-core start)
#   [CDEVCONF] char-device subclass and adaptation layer (framework/cdev-core start)
#   [IOCONF]  full PL011 round-trip through /dev/uart0 (driver/uart-pl011 start)
# `vfs: mount /` and `vfs: mount /dev` evidence "the mount plan really executed" (not just summaries);
# non-zero `irq_ticks` ensures all this happens after the START phase with IRQs enabled.
[[gate]]
name      = "fs-test"
timeout_s = 20
log       = "build/logs/fs.log"
require   = [
  # ADR-0010: selftest pass present and all green. * Not "no FAIL string means pass", but the
  # SUMMARY line must exist (ran >= 1) with fails=0/errors=0 — proving two things at once:
  # selftest was driven, and the switch is on (that line does not exist in an image with selftest off).
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "vfs: mount / ",
  "vfs: mount /dev ",
  "\\[VFSCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[DEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[CDEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  # * ADR-0021: block-device subclass framework (bdev-core). Second device chain of the storage domain,
  #   beside CDEVCONF; once the driver joins (adapter/uboot-mmc) its e2e suite gets its own gate.
  "\\[BDEVCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[IOCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[VFSCONF\\] FAIL",
  "\\[DEVCONF\\] FAIL",
  "\\[CDEVCONF\\] FAIL",
  "\\[BDEVCONF\\] FAIL",
  "\\[IOCONF\\] FAIL",
  "\\[PANIC\\]",
]
# Case tags named individually (trimming one is red too — the split from smoke).
require_tags = [
  "TC-VFS-001", "TC-VFS-002", "TC-VFS-003", "TC-VFS-004", "TC-VFS-005",
  "TC-VFS-006", "TC-VFS-007", "TC-VFS-008", "TC-VFS-009", "TC-VFS-010",
  "TC-VFS-011", "TC-VFS-012", "TC-VFS-013",
  # * ADR-0013 additions (link family): symlink expansion in vfs-core, hard-link shared data body in the FS.
  "TC-VFS-014", "TC-VFS-015", "TC-VFS-016", "TC-VFS-017", "TC-VFS-018",
  "TC-VFS-019", "TC-VFS-020",
  "TC-DEV-001", "TC-DEV-002", "TC-DEV-003", "TC-DEV-004", "TC-DEV-005", "TC-DEV-006",
  "TC-CDEV-001", "TC-CDEV-002", "TC-CDEV-003", "TC-CDEV-004", "TC-CDEV-005",
  "TC-CDEV-006", "TC-CDEV-007", "TC-CDEV-008",
  # * ADR-0021: block-device subclass framework (bdev-core) named individually. TC-BDEV-006/008 take the
  #   "not applicable" branch without a driver, but still emit tags => trimmed/not run is still red.
  "TC-BDEV-001", "TC-BDEV-002", "TC-BDEV-003", "TC-BDEV-004",
  "TC-BDEV-005", "TC-BDEV-006", "TC-BDEV-007", "TC-BDEV-008",
  "TC-IO-001", "TC-IO-002", "TC-IO-003", "TC-IO-004", "TC-IO-005", "TC-IO-006",
  "TC-IO-007", "TC-IO-008", "TC-IO-009", "TC-IO-010", "TC-IO-011", "TC-IO-012",
]

# emmc-test: end-to-end gate for the eMMC (SDHCI) driver through bdev (ADR-0021 / multi-card: ADR-0022).
# Criteria = **four cards** enumerated and identified + bdev ready + two framework summaries (PCI enum/alloc,
#        eMMC round-trip) + 8 cases named individually.
# It also proves: PCIe INTx really delivers (ISR->bh->semaphore), both ADMA2 and PIO data paths read back
# after write, and the "multi-instance" rework (switching one card to PIO does not affect another).
# Machine args (platform's [build.target.qemu].extra) attach four `-device sdhci-pci` + four emmc,
# with backing images made by the post-build gate `fs-images` (see above).
[[gate]]
name      = "emmc-test"
timeout_s = 30
log       = "build/logs/emmc.log"
require   = [
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  # All four PCI endpoints enumerated (device 3..6 => INTx swizzle D/A/B/C => virq 10/7/8/9, no collisions)
  "pci: 00:03.0 1b36:0007",
  "pci: 00:04.0 1b36:0007",
  "pci: 00:05.0 1b36:0007",
  "pci: 00:06.0 1b36:0007",
  "uboot-mmc: eMMC ready",
  "uboot-mmc: /dev/emmc0 ready",
  "uboot-mmc: /dev/emmc3 ready",
  "uboot-mmc: took over 4 sdhci-pci cards",
  "\\[PCICONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "\\[EMMCCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[PCICONF\\] FAIL",
  "\\[EMMCCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-EMMC-001", "TC-EMMC-002", "TC-EMMC-003", "TC-EMMC-004",
  "TC-EMMC-005", "TC-EMMC-006", "TC-EMMC-007", "TC-EMMC-008",
]

# fat-test: end-to-end gate for the **third-party FAT port** (adapter/uboot-fat) (ADR-0022).
# Criteria = all three volumes mounted + `[FATCONF]` summary all green + 8 cases named individually.
# It proves "real FAT volumes on real media": volumes built on the host by mkfs.fat + mcopy (external
# authority tools), with bytes read by the driver matching host-written content byte for byte — a homegrown
# mkfs mirroring a homegrown reader proves nothing, so an external tool must make the bytes.
# The three volumes deliberately use FAT12/FAT16/FAT32: their **root-dir form and FAT width** all differ
# (12/16: fixed root-dir area, 1.5/2-byte entries; 32: root-dir cluster chain + FSInfo).
[[gate]]
name      = "fat-test"
timeout_s = 30
log       = "build/logs/fat.log"
require   = [
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "vfs: mount /fat12 ",
  "vfs: mount /fat16 ",
  "vfs: mount /fat32 ",
  "uboot-fat: /fat12 ready",
  "uboot-fat: /fat16 ready",
  "uboot-fat: /fat32 ready",
  "\\[FATCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[FATCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-FAT-001", "TC-FAT-002", "TC-FAT-003", "TC-FAT-004",
  "TC-FAT-005", "TC-FAT-006", "TC-FAT-007", "TC-FAT-008",
]

# erofs-test: end-to-end gate for the **third-party EROFS port** (adapter/uboot-erofs) (ADR-0022).
# Criteria = /assets mounted + `[EROFCONF]` summary all green + 8 cases named individually.
# It proves both read paths really read an image **made by an external tool**:
#   uncompressed (FLAT_INLINE / FLAT_PLAIN: hello.txt, dir/a.bin, dir/sub/deep.txt)
#   and compressed (**LZ4**: comp/lz4.txt 70000 B, raw.bin 8192 B).
[[gate]]
name      = "erofs-test"
timeout_s = 30
log       = "build/logs/erofs.log"
require   = [
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "vfs: mount /assets ",
  "uboot-erofs: /assets ready",
  "\\[EROFCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[EROFCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-EROFS-001", "TC-EROFS-002", "TC-EROFS-003", "TC-EROFS-004",
  "TC-EROFS-005", "TC-EROFS-006", "TC-EROFS-007", "TC-EROFS-008",
]

# posix-test: end-to-end gate for **runtime/posix's POSIX surface** (ADR-0014/0015).
# Criteria = `[POSIXCONF]` summary all green + 20 tags named individually + boot evidence lines. This gate
# differs from fs-test: fs-test tests the **framework contract** (VFSCONF via native API only), this one
# tests the **POSIX surface itself** (cases include POSIX headers only, no br_* calls) — names/signatures/
# error channel (syscalls -1+errno vs pthread returning an error number) is where bugs live.
[[gate]]
name      = "posix-test"
timeout_s = 25
log       = "build/logs/posix.log"
require   = [
  # ADR-0010: selftest pass present and all green (proves both "selftest was driven" and "switch is on").
  "\\[SELFTEST\\] SUMMARY plugins=[0-9]+ ran=[1-9][0-9]* skipped=[0-9]+ fails=0 errors=0",
  "runtime/posix: POSIX runtime ready",
  "\\[POSIXCONF\\] SUMMARY pass=[0-9]* fail=0 ",
  "irq_ticks=[1-9]",
]
forbid    = [
  "\\[POSIXCONF\\] FAIL",
  "\\[PANIC\\]",
]
require_tags = [
  "TC-POSIX-001", "TC-POSIX-002", "TC-POSIX-003", "TC-POSIX-004", "TC-POSIX-005",
  "TC-POSIX-006", "TC-POSIX-007", "TC-POSIX-008", "TC-POSIX-009", "TC-POSIX-010",
  "TC-POSIX-011", "TC-POSIX-012", "TC-POSIX-013", "TC-POSIX-014", "TC-POSIX-015",
  "TC-POSIX-016", "TC-POSIX-017", "TC-POSIX-018", "TC-POSIX-019", "TC-POSIX-020",
  # ADR-0019: new cases after the pthread surface was completed (per-thread errno / mutexattr / once / rwlock /
  # key(TLS) / lazy detach reclamation / attr+name / timed* timeouts).
  "TC-POSIX-021", "TC-POSIX-022", "TC-POSIX-023", "TC-POSIX-024", "TC-POSIX-025",
  "TC-POSIX-026", "TC-POSIX-027", "TC-POSIX-028",
]

# ------------------------------------------------------------------ post-build gates
[build]
# Short list run **automatically** after a successful `brickie build` (same as the old `all: ... check-string`).
# It lives in the script gates rather than in the compile flow because it is a **criterion**, not a build step.
post = ["check-string", "check-headers", "check-errno", "fs-images"]
