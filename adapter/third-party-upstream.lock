# adapter/third-party-upstream.lock — third_party/ 上游 vendor 树的**只读锁**
#
# 纪律(ADR-0025):
#   * `third_party/` 是**逐字节上游原件**的 vendor 树 —— **永不编辑**(连注释/README/
#     LICENSE 都不动)。本文件逐文件记 sha256, 是这条纪律的**机械判据**:
#       bash tools/check-third-party-pristine.sh     # 任一文件被改 ⇒ 红
#   * 我们对三方件的**一切改动(移植/兼容/对接/自检)** 都在 `adapter/` 下 ——
#     那是本项目的代码, 可以自由改; 每个适配插件的 `NOTICE` 记它派生自哪些上游文件。
#   * 上游换 commit ⇒ 先改这里(连同 third_party/ 的内容), 再跑一次门禁核对。
#     不许"就地改三方件"来适配 —— 要适配就写进 adapter/。
#
# 复现(取基准与逐文件核对):
#   curl -sL -o uboot.tar.gz \
#     https://codeload.github.com/nxp-imx/uboot-imx/tar.gz/bb41975aeb4cbd153b49c9fd62da1d64cd65968d
#   diff -r <解包目录>/<所取子目录> prototype/third_party/uboot-imx/   # 期望无输出

version = 1

[upstream]
