# adapter/uboot-erofs — u-boot EROFS 移植(plugin_type = ability, subkind = fs)
#
# ============================ 第三方模块隔离(ADR-0021 D-3) ============================
# 本插件的**全部源码**是 u-boot NXP 分支(`nxp-imx/uboot-imx`, branch `lf_v2026.04`,
# commit `bb41975aeb4cbd153b49c9fd62da1d64cd65968d`)的 EROFS 只读文件系统
# (`fs/erofs/**`)与 LZ4 解码器(`lib/lz4.c` + `include/u-boot/lz4.h`)的**移植/改写**。
# 那些文件是 **GPL-2.0+**(`erofs_fs.h` 是 `GPL-2.0-only OR Apache-2.0`, `lz4.c` 是
# `GPL 2.0+ OR BSD-2-Clause`)。因此:
#   - 本插件(且**只有**本插件)声明 `api_type = "third_party"` /
#     `license = "GPL-2.0-or-later"`; 来源逐文件列在 `NOTICE`, 全文在 `LICENSE.GPL-2.0`;
#   - `framework/vfs-core`、`framework/bdev-core`、`platform/**` 保持 WTFPL, **不含** GPL 代码;
#   - ⚠ 残余风险(与 uboot-mmc 同款, 如实记录): 静态链进同一镜像后, 整镜像在分发时
#     仍构成 GPL 组合作品; "目录隔离"解决的是**代码归属清晰**, 不是许可传染。
#     登记在 `../../../WORKAROUNDS.md` 的 `br-wa-tp-001`。
# WORKAROUND(br-wa-tp-001): 上面这条残余许可风险(整镜像构成 GPL 组合作品)的登记点。
# ====================================================================================
#
# 设计/行为依据(实现是移植, 但对接面按本项目契约):
#   - `docs/7-storage/7-03-concrete-fs.md`(EROFS = 只读压缩 FS);
#   - `framework/vfs-core/include/br/vfs/br_vfs.h`(四层 ops 契约; 本件的唯一权威);
#   - `docs/decisions/0009-vfs-storage-stack.md`(SD-3: inode 瞬态 = 路径包装)。
#
# ★ 依赖面(方向都合法: third_party 消费者不受 native→third_party 禁则约束):
#   - `framework/vfs-core`(init): 实现 `br_fs_ops`/`br_inode_ops`/`br_file_ops` 并
#     `br_mount_register("/assets", ...)`;
#   - `framework/bdev-core`(init): `br_bdev_get("emmc3")` 取块设备;
#   - `adapter/uboot-mmc`(init): 它在本插件之前注册 `emmc3` —— 相位的先后由
#     这条 init 边保证(本插件的挂载落在 start 相, 与它同相, 拓扑序在它之后)。
#
# ★ 为什么挂载在 `start` 相而不是 `core` 相
#   与 `adapter/uboot-mmc` 同源的理由: 块设备是在**它的** start 相里注册的
#   (中断驱动意味着 CORE 相等不到中断)。本插件只消费块设备, 所以"设备在不在"这件事
#   只有到 start 相才有答案。`early_init`/`init` 因此都是空转。
schema = 1

[plugin]
name        = "adapter/uboot-erofs"
plugin_type = "ability"
api_type    = "third_party"
subkind     = "fs"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "u-boot EROFS 移植(GPL-2.0+): 只读, 未压缩 + LZ4 压缩块, emmc3 挂 /assets"
license     = "GPL-2.0-or-later"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 16
notes    = "超级块/映射/解压的静态缓冲(4 KiB 块缓冲 + LZ4 输出缓冲); 运行期 inode 与目录流走 core 堆"

[[mount]]
path  = "/assets"
order = 5

[[dep]]
name  = "framework/vfs-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/bdev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "adapter/uboot-mmc"
range = ">=0.1.0"
kind  = "init"

[selftest]
# ADR-0010: 表在场 = 本插件有自检。用例: TC-EROFS-001..008。
cases = 8

[build]
# ★ 三个目录, 分工是**硬边界**(见 ADAPTER-NOTES.md):
#     src/     上游 u-boot `fs/erofs/**` + `lib/lz4.c` 的派生件
#              (**只**放有上游对应物的文件);
#     compat/  运行环境接地(u-boot 风格的环境 → brickOS): `erofs_compat.h`;
#     glue/    brickOS 对接: 块层 shim(字节偏移→扇区)+ VFS 四层 ops + 生命周期钩子
#              (`erofs_vfs.c`)、一致性用例(`erofs_selftest.c`)。
#   依赖方向单向: `src/` 只经 `compat/erofs_compat.h` 拿运行环境, **不**直接 include
#   任何 `<br/...>`(判据 = `tools/check-third-party-isolation.sh`)。
# ★ `includes` 是给同一插件内各目录互相找头用的(`src/erofs_internal.h` include
#   `compat/erofs_compat.h`, `glue/*.c` include `src/erofs_internal.h`)。
#   本件没有 `include/`, 所以不抛对外头(消费面仍是 vfs/bdev 的 native 面)。
# ★ **vendor 代码的告警口径**(适配决策, 不是给上游开脱):
#   上游 `fs/erofs/**` 是 u-boot 的代码, 它按 u-boot 自己的 `-W...` 集合写(那份**不含**
#   本项目的 `-Wshadow`/`-Wpointer-arith`/`-Wmissing-prototypes`/`-Wsign-compare`/
#   `-Wunused-parameter`)。事实: 上游 `super.c` 的局部变量就叫 `sbi`(故意遮蔽全局),
#   `data.c` 对 `void *` 做算术(GNU 扩展), `namei.c` 的 `erofs_namei` 没有前置原型。
#   ⇒ 编 vendor 代码时**按它的口径**: 关掉这几条。**不能**为了过我们的告警去改上游
#   (那正是本刀要消灭的"就地改三方件")。
cflags = [
  "-Wno-shadow",
  "-Wno-pointer-arith",
  "-Wno-missing-prototypes",
  "-Wno-sign-compare",
  "-Wno-unused-parameter",
  "-Wno-int-to-pointer-cast",
  "-Wno-pointer-to-int-cast",
]

sources  = [
  # 上游 EROFS 与 LZ4 —— **原样编译**(不复制、不改动; 判据见
  # tools/check-third-party-pristine.sh)
  "../../third_party/uboot-imx/fs/erofs/super.c",
  "../../third_party/uboot-imx/fs/erofs/namei.c",
  "../../third_party/uboot-imx/fs/erofs/data.c",
  "../../third_party/uboot-imx/fs/erofs/zmap.c",
  "../../third_party/uboot-imx/fs/erofs/decompress.c",
  "../../third_party/uboot-imx/lib/lz4.c",
  # 适配层: 块层 + VFS 对接 + 自检(本项目代码)
  "glue/*.c",
]
includes = [
  "compat", "glue",
  # 上游头: `internal.h` 在 fs/erofs, `<u-boot/lz4.h>` 在 include
  # 上游 `internal.h` 所在目录(glue 要 include 它; 上游自己的 .c 是同目录相对包含)
  "../../third_party/uboot-imx/fs/erofs",
]
