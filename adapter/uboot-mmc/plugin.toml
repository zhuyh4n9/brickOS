# adapter/uboot-mmc — u-boot MMC/SDHCI 移植(plugin_type = ability, subkind = io)
#
# ============================ 第三方模块隔离(ADR-0021 D-3) ============================
# 本插件的源码分三层(ADR-0026 D-2/D-3):
#   - `third_party/uboot-imx/drivers/mmc/**` + `include/mmc.h` + `include/sdhci.h`:
#     u-boot NXP 分支(`nxp-imx/uboot-imx`, branch `lf_v2026.04`,
#     commit `bb41975aeb4cbd153b49c9fd62da1d64cd65968d`)的**逐字节原件**, 只读、
#     **原样参与编译**(`[build].sources` 直接点名; 没有副本 ⇒ 不可能漂移);
#   - `compat/`: u-boot 运行环境(我们写的头名适配壳 + `mmc_env.h` + 配置矩阵
#     `generated/autoconf.h`);
#   - `glue/`: 本项目的对接(PCIe 绑定、静态实例表、中断、bdev ops、ioctl、自检)。
# 那些上游文件是 **GPL-2.0+**。因此:
#   - 本插件(且**只有**本插件)声明 `api_type = "third_party"` /
#     `license = "GPL-2.0-or-later"`; 来源逐文件列在 `NOTICE`, 全文在 `LICENSE.GPL-2.0`;
#   - `framework/bdev-core`、`framework/pci-core`、`platform/**` 保持 WTFPL, **不含** GPL 代码;
#   - 工具链的规则禁止 `native` 插件依赖 `third_party` 插件, 所以"WTFPL 薄胶水包 GPL 库"这种
#     切法在本工具链里不合法 ⇒ **bdev 对接/PCIe 绑定/中断绑定都写在本插件内**(见 ADR-0021 D-3)。
#   - ⚠ 残余风险(如实记录): 静态链进同一镜像后, 整镜像在分发时仍构成 GPL 组合作品;
#     "目录隔离"解决的是**代码归属清晰**, 不是许可传染。这是拍板时明知并接受的取舍。
# WORKAROUND(br-wa-tp-001): 上述残余许可风险 + 本刀为工具链补了 third_party 描述符模板
#   (native 模板的逐字节副本)并随 `make tools-prebuilt` 刷新了自举种子 —— 详见
#   `WORKAROUNDS.md` 的 `br-wa-tp-001`。
# ====================================================================================
#
# 设计/行为依据:
#   - `docs/7-storage/7-02-bdev.md` §1/§4(bdev 形状; 数据通路要能指出 DMA/PIO)、§5(ISR→bh→唤醒);
#   - `docs/decisions/0021-bdev-pci-emmc.md` D-3(三方隔离)/D-4(中断 + ADMA2/PIO)/D-5(flush 口径);
#   - `docs/decisions/0026-third-party-vendor-and-adapter.md`(**本刀的结构**: vendor 原件 +
#     compat 环境 + glue 对接; `src/` 那一层取消);
#   - 对照源码与差异分析: `docs/analysis/0001-emmc-bdev-gap.md` §2/§3/附录 B。
#
# ★ 依赖面(方向都合法: third_party 消费者不受 native→third_party 禁则约束):
#   - `framework/bdev-core`(init): 本插件实现 `br_bdev_ops` 并注册设备;
#   - `framework/pci-core`(init): 取 sdhci-pci 的 BAR0 基址与 INTx virq;
#   - `framework/dev-core`(type): 用它的 ioctl 编码宏(`BR_IOR/IOW/IO`);
#   - `framework/vfs-core`(type): `br_dev.h` 的 `open_file` 签名引用 `br_file_ops_t`。
schema = 1

[plugin]
name        = "adapter/uboot-mmc"
plugin_type = "ability"
api_type    = "third_party"
subkind     = "io"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "u-boot MMC 协议核心 + 通用 SDHCI 主机(上游原件原样编译, GPL-2.0+): PCIe INTx 中断驱动, ADMA2/PIO 运行期可选, 多卡(4 实例)经 bdev 注册为 emmc0..emmc3"
license     = "GPL-2.0-or-later"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
# ★ ADR-0022: 主机层是**静态实例表**(每卡一份 `struct sdhci_host` —— 上游的类型, 约 200 B
#   + 一个 adma 表指针)。按本平台能挂满的卡数(`BR_EMMC_MAX_DEVS == 4`, 受 4 根 INTx 线
#   约束)封顶, 所以是**编译期确定的上界**, 不是"随枚举数量增长"。
# ★ ADR-0026: 上游 `mmc_create()` 会为每卡 `calloc(1, sizeof(struct mmc))`(约 1.1 KiB,
#   含 512 B ext_csd 由上游 `malloc` 单独拿), 那是**运行期堆**分配, 不计入本项;
#   ADMA2 描述符表(每卡 `ADMA_TABLE_SZ = 8` B, 经环境层 `memalign` 走 DMA 池)同理。
used_kib = 16
notes    = "4 × struct sdhci_host(静态实例表, 约 1 KiB) + 4 × {信号量, pending, IRQ 计数}; 上游 mmc_create 的 struct mmc(4 × ~1.1 KiB)与 ext_csd(4 × 512 B)走 core 堆, ADMA2 描述符表(4 × 8 B)走 DMA 池, 均不计入本项"
# ★ 不声明 stack: 本驱动不创建线程 —— 全部 ops 跑在调用者线程上; ISR/bh 用的是 core 已有的
#   中断栈与下半部上下文(ADR-0021 D-4)。

# ---- 结构依赖 ----
[[dep]]
name  = "framework/bdev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/pci-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/dev-core"
range = ">=0.1.0"
kind  = "type"

[[dep]]
name  = "framework/vfs-core"
range = ">=0.1.0"
kind  = "type"

[selftest]
# ADR-0010: 表在场 = 本插件有自检。用例: TC-EMMC-*。
cases = 8

[build]
# ★ 三个目录, 分工是**硬边界**(见 ADAPTER-NOTES.md):
#     (无 src/) 上游 `drivers/mmc/**` 由下面的 `sources` **直接点名**(原件, 无副本);
#     compat/   u-boot 运行环境: 头名适配壳 + `mmc_env.h`(类型/宏/时间/MMIO/cache/DMA) +
#               `generated/autoconf.h`(**配置矩阵**, u-boot 真实构建里那个文件的角色);
#     glue/     brickOS 对接: 上游的运行环境钩子(memalign/等待原语/板级弱钩子)、
#               PCIe 绑定 + 静态实例表 + 中断(ISR/bh) + bdev ops(`emmc_bdev.c`)、
#               一致性用例(`emmc_selftest.c`)。
#   依赖方向单向: `glue/` → `compat/` → `third_party/`(判定见 tools/check-third-party-pristine.sh
#   的判据⑤: 全树不出现 `#include <third_party/...>`, 转发一律走 compat/ 的相对路径壳)。
# ★ `includes` 是给同一插件内各目录互相找头用的; 本件没有 `include/`, 不抛对外头。
#
# ★ **vendor 代码的告警口径**(适配决策, 不是给上游开脱):
#   上游 `drivers/mmc/**` 按 u-boot 自己的 `-W...` 集合写(那份**不含**本项目的
#   `-Wshadow`/`-Wpointer-arith`/`-Wmissing-prototypes`/`-Wsign-compare`/`-Wunused-parameter`/
#   `-Wint-to-pointer-cast`)。实测踩到的例子: `mmc.c` 的 `mmc_startup_v4()` 有故意遮蔽全局的
#   局部名, `sdhci.c` 对 `void *` 做算术(GNU 扩展, 因为 `ioaddr` 是 `void *`), 上游的
#   `printf` 调用点把 `uint` 传给 `%d`。⇒ 编 vendor 代码时**按它的口径**: 关掉这几条。
#   **不能**为了过我们的告警去改上游 —— 那正是 ADR-0026 要消灭的"就地改三方件"。
#   `-Wno-unused-function` 也加上: 上游按 u-boot 的 Makefile 裁剪**文件**, 我们裁剪**配置**
#   (矩阵里关掉 HS200/tuning/... 之后会留下几个只有声明没有调用者的 static 函数)。
cflags = [
  # ★ 偏离登记(见 ADAPTER-NOTES.md 的"偏离"一节): `compat/std-names/` 里有两个
  #   **标准头名**的壳(`errno.h`/`time.h`), 上游 `mmc.c`/`sdhci.c` 字面 include 它们。
  #   这两个名字**不能**走 `includes`: brickie 的包含面判据(ADR-0018)是**名字级**的
  #   (名字 → 归属插件, 看不到 per-unit 的 `-I`), 而 `runtime/posix/include/` 下也有
  #   `errno.h`/`time.h` ⇒ 放进声明面会让 `runtime/posix/src/posix.c` 与 `iface/posix` 被判成
  #   "include 了 adapter/uboot-mmc 的头"(7 条 BRV-MF-0001, 而它们的 `-I` 里根本没有本目录)。
  #   这两个壳不是本插件抛给别人的接口面, 只是两个标准名的**单元级环境补丁** ⇒ 走 cflags。
  #   回归条件: brickie 的包含面判据能按 per-unit `-I` 解析(或排除标准 C 头名)时, 搬回 includes。
  "-Iadapter/uboot-mmc/compat/std-names",
  "-Wno-shadow",
  "-Wno-pointer-arith",
  "-Wno-missing-prototypes",
  "-Wno-sign-compare",
  "-Wno-unused-parameter",
  "-Wno-int-to-pointer-cast",
  "-Wno-pointer-to-int-cast",
  "-Wno-unused-function",
]

sources = [
  # ---- 上游原件: **原样编译**(不复制、不改动; 判据 = tools/check-third-party-pristine.sh)
  "../../third_party/uboot-imx/drivers/mmc/mmc.c",
  "../../third_party/uboot-imx/drivers/mmc/mmc_write.c",
  # `mmc_legacy.c` 是 `!DM_MMC` 形态的设备链与块设备挂钩(`mmc_create`/`find_mmc_device`/
  # `mmc_get_blk_desc`/`mmc_list_init`…)—— 任务书 §2.2 已核实它是 legacy 形态的必需件。
  "../../third_party/uboot-imx/drivers/mmc/mmc_legacy.c",
  "../../third_party/uboot-imx/drivers/mmc/sdhci.c",
  # `sdhci-adma.c` 提供 ADMA2 描述符表的构造(矩阵里的 `CONFIG_MMC_SDHCI_ADMA_HELPERS`)。
  "../../third_party/uboot-imx/drivers/mmc/sdhci-adma.c",
  # ---- 适配层: 运行环境钩子 + bdev/PCIe/中断对接 + 自检(本项目代码)
  "glue/*.c",
]
includes = [
  "compat", "glue",
  # 上游 `mmc_private.h` 与那五个 .c 同目录(它们用 `#include "mmc_private.h"` 相对包含,
  # 但 glue 侧若要引用它就得有这个 -I)。★ 本目录**只有 `mmc_private.h` 一个头**,
  # 不含 `<mmc.h>`/`<sdhci.h>` 的同名壳, 所以按字典序排在 `compat` 前面也不会盖住任何壳。
  "../../third_party/uboot-imx/drivers/mmc",
]
