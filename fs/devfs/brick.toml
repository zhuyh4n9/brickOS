schema = 1

[plugin]
name        = "fs/devfs"
plugin_type = "ability"
api_type    = "native"
subkind     = "fs"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "设备文件系统: 把 dev-core 注册表投影为 /dev/<name> 节点(实时枚举, open 经类 open_file 钩子)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "静态部分只有根 inode + iops/fops 表; 设备节点 inode 在 lookup 时从 core 堆现造(约 48 B/次)"

[[dep]]
name  = "hal/dev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "hal/cdev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "hal/vfs-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "fs/tmpfs"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name   = "hal/dev-core"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_dev_count"

[[dep]]
name   = "hal/vfs-core"
range  = ">=0.1.0"
kind   = "runtime"
symbol = "br_mount_register"

# core layer (ADR-0038): core is a first-class interface provider. Every consumer declares it --
# transitively reaching `<br/core/**>` through another plugin no longer authorizes anything. The
# door is the skin `runtime/core` (one unit per header); `platform` names `core/c_core` directly
# because the direction table forbids a platform from depending on an ability plugin.

[[dep]]
name  = "runtime/core"
range = ">=0.1.0"
kind  = "runtime"

[build]

sources  = ["src/*.c"]
