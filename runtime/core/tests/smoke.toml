# runtime/core — 用例声明面(人写)
#
# 字段形状照 `6-01` §2 的用例表契约: {id, pre, steps, expect, sched, platform}。
# ⚠ 骨架(v0.2 不消费): 真正跑起来的判据是**声明面与编译期**的三条:
#   ① `brickie check --iface`: 20 条 `reexport_of` 都能解到 `core/c_core` 的现有单元(不变量 3);
#   ② `brickie build`: 消费者的 `-I` 里没有 core 头, 除非它声明了本皮肤 ⇒ 漏声明 = 编译期红;
#   ③ `brickie build` 的符号审计: 消费者用到 core 符号而没声明本皮肤 ⇒ BRV-DEP-0012。
schema = 1

[[case]]
id       = "TC-RUNTIME-CORE-001"
pre      = "product 闭包含任一消费者插件"
steps    = ["读 runtime/core 的 [[export]]", "核对全部 form = \"skin\" 且 reexport_of 指向 20 个单元(core/c_core 12 + hal/{int,mm,sched} 8, ADR-0039)", "核对 entries/ hash 都不手写(面由 provider 派生)"]
expect   = "皮肤无条目 = 没有第二份真值; 单元 id `runtime/core#<unit>` 与 provider 单元一对一"
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]

[[case]]
id       = "TC-RUNTIME-CORE-002"
pre      = "同上"
steps    = ["去掉某消费者的 [[dep]] runtime/core", "brickie check --deps", "brickie build"]
expect   = "check 报 BRV-DEP-0012(#include 面); build 在组合期/编译期即失败(找不到 <br/core/**>) —— 声明是使用前提"
sched    = ["coop", "preempt"]
platform = ["qemu-aarch64"]
