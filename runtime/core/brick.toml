schema = 1

[plugin]
name          = "runtime/core"
plugin_type   = "ability"
api_type      = "native"
subkind       = "service"
lang          = "c"
phase         = "late"
version       = "0.1.0.0"
symbol_prefix = "runtime_core_"
summary       = "core 层规格皮肤: 把 core 层的 20 个单元(一头一单位; core/c_core 12 + hal/{int,mm,sched} 8, ADR-0039)原样转出, 是 core 层唯一的对外入口"
license       = "WTFPL"

# Why a **skin** and not a wrapper (ADR-0038 §3):
#   1. it is where the core layer's *specification* lives (`README.md`: naming, error convention,
#      "the header is the only declaration surface", one header = one unit, no globals);
#   2. it is core's only outward door: consumers declare `[[dep]] runtime/core`, so splitting
#      `core/c_core` into several plugins (or re-implementing it in another language under
#      `frameworks/core/`) changes ONE line per unit here -- not 20 manifests.
# A skin holds no state and no implementation: the declarations and the definitions stay in core.
# Stateless (ram 1 KiB = the three empty hooks and the descriptor).

[[res]]
kind     = "ram"
used_kib = 1
notes    = "皮肤无状态: 三个空钩子 + 一张转出的头文件面"

# WORKAROUND(br-wa-rel-001): the core surface is **not frozen** in the prototype phase, so
# `check --profile release` reports BRV-VER-0004 for every unit re-exported here (dev: info).
# Repaying it is a publish+freeze of core's 20 units (core/c_core + hal/{int,mm,sched}) -- see
# WORKAROUNDS.md.

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

# Same alias table as core: the hash normalises to C spelling, so a future non-C core with the
# same normalised surface keeps `runtime/core`'s units hash-identical.
[iface.typedefs]
br_u8        = "unsigned char"
br_s8        = "signed char"
br_u16       = "unsigned short"
br_s16       = "signed short"
br_u32       = "unsigned int"
br_s32       = "signed int"
br_u64       = "unsigned long"
br_s64       = "signed long"
br_size_t    = "unsigned long"
br_uintptr_t = "unsigned long"
br_intptr_t  = "signed long"
br_bool      = "int"
br_time_t    = "br_u64"
br_err_t     = "int"

# Compile-time edges only: the skin adds no init step, so no phase assertion is created and no
# boot-chain edge appears (the units it re-exports are declarations, not runtime services).
#
# Since ADR-0039 core's surface is split across four providers, and the skin re-exports a unit from
# each: core keeps base + plugin manager, and `hal/{int,mm,sched}` hold the interrupt / memory /
# scheduling mechanisms. Consumers still declare **this** skin only -- the split is invisible to
# them, which is the whole point of the door.
[[dep]]
name  = "core/c_core"
range = ">=0.1.0"
kind  = "type"

[[dep]]
name  = "hal/int"
range = ">=0.1.0"
kind  = "type"

[[dep]]
name  = "hal/mm"
range  = ">=0.1.0"
kind  = "type"

[[dep]]
name  = "hal/sched"
range  = ">=0.1.0"
kind  = "type"

# ---- unit `log`: re-exports <br/core/br_log.h> ----
[[export]]
name         = "log"
api_iface    = "native"
form         = "skin"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"
reexport_of  = ["core/c_core#log"]

# ---- unit `console`: re-exports <br/core/br_console.h> ----
[[export]]
name         = "console"
api_iface    = "native"
form         = "skin"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
status       = "experimental"
reexport_of  = ["core/c_core#console"]

