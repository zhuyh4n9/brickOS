# runtime/posix — POSIX 运行时(plugin_type = ability, subkind = service, api_type = runtime_adapter)
#
# ★ 名字(ADR-0015): 本插件原名 `service/svc-posix`(设计 D18 的口径), 现改为 `runtime/posix`
#   并落在 `runtime/` 命名空间下 —— "它不是一个普通服务, 而是一整套运行时"。
#   `subkind = "service"` **保持不变**: 相位推导(ability + service ⇒ LATE)与 D18 的
#   "POSIX 运行时服务"定位都靠它, 换 subkind 会把 init 掉到 CORE。
#
# 设计出处: `docs/1-architecture/1-01-architecture.md` §7(v0.5/D18: **POSIX 双角色拆分** ——
# `runtime/posix` = 实现(普通服务), `iface-posix` = 薄皮肤; §7.6 三方移植双模式)、
# `docs/11-service/11-01-service.md` §1/§2(POSIX 运行时服务: fd 表主人 + `errno = -ret`)、
# `docs/11-service/11-02-svc-posix-subset.md`(**覆盖清单**: TR-A/TR-B 是本件的范围)、
# `docs/7-storage/7-01-vfs.md` §1/§4.1(fd 表项 = `br_file_t*`; `br_open` 是底层原语)。
# 逐条裁定与偏离: `docs/decisions/0014-svc-posix-posix-runtime.md`。
#
# ★ 依赖面(三条, 一条都不能少):
#   - `framework/file-table`(**init**): fd 表的**唯一主人**在那里(ADR-0012)。本件只消费它
#     —— 这正是"共享状态单一主人"的落地: `br_ft_alloc` 在全树只出现在本件源码里。
#   - `framework/vfs-core`(**init**): `open/read/write/stat/dirent` 的底层原语;
#     vfs 刻意**不**做访问模式执法(ADR-0009 §5 遗留项 5)⇒ 那一层归本件。
#   - `platform/qemu-aarch64`(**runtime**): pthread/时间要线程与时钟, 那些由平台与 core 提供;
#     声明 `runtime` 是为了让组合期闭包把平台拉进来(与 sched 插件同型)。
# ★ 相位: `phase = "late"` —— `ability` + `subkind = service` 的类别决定(brickie 的
#   `is_service_like`), 不是自选项。runtime/posix 要在 core 的堆/调度/服务注册表就绪之后才 init。
# ★ `api_type = "runtime_adapter"`: 它是"为 third_party 提供接口支持的适配基座"(§3.1 的分类
#   定义)。`iface-posix` 将来以 `form = "skin"` + `reexport_of` 再导出本件的单元 —— 分类必须
#   与基座相等, 所以本件取 runtime_adapter 而不是 native。
schema = 1

[plugin]
name        = "runtime/posix"
plugin_type = "ability"
api_type    = "runtime_adapter"
subkind     = "service"
lang        = "c"
phase       = "late"
version     = "0.1.0.0"
summary     = "POSIX 运行时: fd/文件/目录/链接/线程/时间/stdio 子集(errno = -ret 零转换)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 4
notes    = "cwd 128 B + 记录锁 16 槽 + FILE* 池 8 槽 + pthread 线程记录 8 条。★ pthread_create 的线程栈从 **core 堆**切(4 KiB/线程), 不占本件的 [[res]].stack —— 那一栏的语义是'本插件自建线程的栈'(§3 裁定 10), 而本件不建常驻线程"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

# ---- 类型别名表(sig 里用的名字 ↔ 底层 C 类型) ----
[iface.typedefs]
br_u8        = "uint8_t"
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_s64       = "int64_t"
br_size_t    = "size_t"
br_bool      = "int"
br_uintptr_t = "uintptr_t"

# ---- 结构依赖 ----
[[dep]]
name  = "framework/file-table"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/vfs-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "platform/qemu-aarch64"
range = ">=0.1.0"
kind  = "runtime"

# ---- 导出面(本件 = br-svcposix.txt 的候选面; `3-01` §15 第五批) ----
# ★ `sig` 此刻**不逐个声明**: 本单元是 `freeze_state = "unfrozen"` / `status = "experimental"`,
#   而 POSIX 面有一百多个符号 —— 逐个写 sig 会引入"声明与头文件漂移"的第二处真值。
#   升格为 frozen(第五批)时再按头文件逐条补 sig, 届时由 golden 管线做符号级真值。
[[export]]
api_iface    = "runtime_adapter"
form         = "api"
name         = "posix"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:b8697b3ba530dd77f2f6ffb008a99774d7b839c8f57a1ebefdcfc150118becc8"
status       = "experimental"

