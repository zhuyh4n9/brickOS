schema = 1

[plugin]
name        = "runtime/posix"
plugin_type = "ability"
api_type    = "runtime_adapter"
subkind     = "service"
lang        = "c"
phase       = "late"
version     = "0.1.0.0"
summary     = "POSIX 运行时: fd/文件/目录/链接/线程/时间/stdio 子集(errno = -ret 零转换)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 4
notes    = "cwd 128 B + 记录锁 16 槽 + FILE* 池 8 槽 + pthread 线程记录 8 条。★ pthread_create 的线程栈从 **core 堆**切(4 KiB/线程), 不占本件的 [[res]].stack —— 那一栏的语义是'本插件自建线程的栈'(§3 裁定 10), 而本件不建常驻线程"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u8        = "uint8_t"
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_s64       = "int64_t"
br_size_t    = "size_t"
br_bool      = "int"
br_uintptr_t = "uintptr_t"

[[dep]]
name  = "hal/file-table"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "hal/vfs-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "platform/qemu-aarch64"
range = ">=0.1.0"
kind  = "runtime"

# core layer (ADR-0038): core is a first-class interface provider. Every consumer declares it --
# transitively reaching `<br/core/**>` through another plugin no longer authorizes anything. The
# door is the skin `runtime/core` (one unit per header); `platform` names `core/c_core` directly
# because the direction table forbids a platform from depending on an ability plugin.
[[dep]]
name  = "runtime/core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "runtime_adapter"
form         = "api"
name         = "posix"
version      = "0.1.1.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:8f0496311e39ed366415a646bce221ebae7e51226efaab99456c2889a0c87574"
status       = "experimental"

