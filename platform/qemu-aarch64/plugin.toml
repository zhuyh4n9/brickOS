# platform/qemu-aarch64 — 插件声明面(人写; **插件级唯一真值**, BRV-D4)
#
# 由 `brickie new platform platform/qemu-aarch64` 生成骨架后填入真实内容;
# 之后由人维护 —— brickie 不覆盖人写文件(§8.4)。
# 本件还清了 `br-wa-entry-001`(该台账条目已注销)的第 ② 条: "本目录收敛为插件
# platform/qemu-aarch64(带 BR_PLUGIN 描述符 + manifest)"。
#
# 本件现在声明**两个接口单元**:
#   #plat  平台契约(reset/console/timer/中断初始化与一致性用例入口)
#   #gicv3 GICv3 方言契约(设计 3-02 §4.1 的 `br_pic_ops` 填表的 ISA 侧)
schema = 1

[plugin]
name        = "platform/qemu-aarch64"
plugin_type = "platform"
api_type    = "native"          # 平台抛 native 面(§3.1)
lang        = "c"
phase       = "core"            # 第 ② 个完成点 = CORE(platform 有 init; §7.2 判例)
version     = "0.1.0.0"         # COMPAT_GEN.MAJOR.MINOR.REVISE(§5.2)
summary     = "QEMU virt (aarch64): reset/向量表/link.ld + PL011 早期 console + arch timer + GICv3 + IRQ 绑定表 + 4KB 恒等映射页表/region 表/MMU 开栈"
license     = "WTFPL"

# ---- 资源 ----(platform 的 [[res]] 同时是该 kind 的"平台容量", 裁定 R-6)
# ★ 0.1.3.0 起 ram 容量从 4 KiB 抬到 8 MiB: platform 的 region 表把 RAM 划成
#   heap(1 MiB)/ contig(256 KiB)/ page(1 MiB)/ dma(256 KiB)/ reserved(16 KiB)
#   四池 + 测试保留区, 合计约 2.5 MiB; 8 MiB 是"窗口"上界(恒等映射的 4KB 页表
#   窗口), 也是给 v1.x 池扩张留的余量。core 的静态池仍不计入本项。
[[res]]
kind     = "ram"
used_kib = 8192
notes    = "平台容量 = 8 MiB 恒等映射窗口: 页表 20 KiB + 向量表/PIC/一致性用例数据 + 划给 core 的三池(heap 1 MiB/contig 256 KiB/page 1 MiB/DMA 256 KiB/保留 16 KiB)"
[[res]]
kind     = "stack"
used_kib = 4
notes    = "EL1 早期栈(link.ld 里的 64 KiB 预留); 异常帧 320 B 在栈上, 单帧遍历靠 x29 链"

[compat]
core       = ">=0.1.0"          # 对 core 的版本依赖(range 固定 3 段)
api_rev    = 1
hash_scope = "decl"             # v0.1 只允许 decl(§6.6)
truth      = "decl"             # 与 hash_scope 成对(V-11)
abi_id     = ""                 # v0.1 占位; v0.6 由工具链指纹填充

[iface.typedefs]
br_u64  = "uint64_t"
br_u32  = "uint32_t"
br_u8   = "uint8_t"
br_bool = "bool"

# ---- 导出面 ①: 平台契约(interface 单元 `platform/qemu-aarch64#plat`)----
[[export]]
name         = "plat"
api_iface    = "native"         # 必须等于 [plugin].api_type(TAX-0016)
form         = "api"            # 本插件自有的面
version      = "0.1.3.0"        # 0.1.1.0 中断扩面 / 0.1.2.0 中断开跑入口 / 0.1.3.0 内存映射(MEMCONF)
compat_gen   = 0                # v0.1 期间恒 0(§14: 无合法冻结)
freeze_state = "unfrozen"
# 由人从快照 `api/iface/platform/qemu-aarch64/plat.toml` **抄回**(§9.1.1: 机器不改人写文件);
# 与快照不等 ⇒ `BRV-IFACE-0012` 红(V11④: hash 是同一真值的两处记录)。
hash         = "sha256:3863fa62c2d559a6b3ca3e81fc5d99f75b188ec0b2203ddacf331cdfb92139a7"
