# platform/qemu-aarch64 — 插件声明面(人写; **插件级唯一真值**, BRV-D4)
#
# 由 `brickie new platform platform/qemu-aarch64` 生成骨架后填入真实内容;
# 之后由人维护 —— brickie 不覆盖人写文件(§8.4)。
# 本件还清了 WORKAROUND(br-wa-entry-001) 的第 ② 条: "本目录收敛为插件
# platform/qemu-aarch64(带 BR_PLUGIN 描述符 + manifest)"。
#
# 本件现在声明**两个接口单元**:
#   #plat  平台契约(reset/console/timer/中断初始化与一致性用例入口)
#   #gicv3 GICv3 方言契约(设计 3-02 §4.1 的 `br_pic_ops` 填表的 ISA 侧)
schema = 1

[plugin]
name        = "platform/qemu-aarch64"
plugin_type = "platform"
api_type    = "native"          # 平台抛 native 面(§3.1)
lang        = "c"
phase       = "core"            # 第 ② 个完成点 = CORE(platform 有 init; §7.2 判例)
version     = "0.1.0.0"         # COMPAT_GEN.MAJOR.MINOR.REVISE(§5.2)
summary     = "QEMU virt (aarch64): reset/向量表/link.ld + PL011 早期 console + arch timer + GICv3 + IRQ 绑定表"
license     = "WTFPL"

# ---- 资源 ----(platform 的 [[res]] 同时是该 kind 的"平台容量", 裁定 R-6)
[[res]]
kind     = "ram"
used_kib = 4
notes    = "向量表 2 KiB + PIC 实例/绑定表/一致性用例数据(不含 core 的静态池)"
[[res]]
kind     = "stack"
used_kib = 4
notes    = "EL1 早期栈(link.ld 里的 .stack 段); 异常帧 320 B 在栈上"

[compat]
core       = ">=0.1.0"          # 对 core 的版本依赖(range 固定 3 段)
api_rev    = 1
hash_scope = "decl"             # v0.1 只允许 decl(§6.6)
truth      = "decl"             # 与 hash_scope 成对(V-11)
abi_id     = ""                 # v0.1 占位; v0.6 由工具链指纹填充

[iface.typedefs]
br_u64  = "uint64_t"
br_u32  = "uint32_t"
br_u8   = "uint8_t"
br_bool = "bool"

# ---- 导出面 ①: 平台契约(interface 单元 `platform/qemu-aarch64#plat`)----
[[export]]
name         = "plat"
api_iface    = "native"         # 必须等于 [plugin].api_type(TAX-0016)
form         = "api"            # 本插件自有的面
version      = "0.1.2.0"        # 0.1.1.0 中断扩面 / 0.1.2.0 收口"中断开跑"入口(见 CHANGELOG)
compat_gen   = 0                # v0.1 期间恒 0(§14: 无合法冻结)
freeze_state = "unfrozen"
# 由人从快照 `api/iface/platform/qemu-aarch64/plat.toml` **抄回**(§9.1.1: 机器不改人写文件);
# 与快照不等 ⇒ `BRV-IFACE-0012` 红(V11④: hash 是同一真值的两处记录)。
hash         = "sha256:088c4dae5709b104bf874edc8c22251641e7ec82afac651284ce05d63d22b4ee"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_plat_early_init"
sig  = "void (void)"
[[export.entries]]
kind = "func"
name = "br_plat_name"
sig  = "const char* (void)"
[[export.entries]]
kind = "func"
name = "br_plat_isa"
sig  = "const char* (void)"
[[export.entries]]
kind = "func"
name = "br_plat_ticks_freq"
sig  = "br_u64 (void)"
[[export.entries]]
kind = "func"
name = "br_plat_ticks_now"
sig  = "br_u64 (void)"
[[export.entries]]
kind = "func"
name = "br_plat_park_forever"
sig  = "void (void)"
[[export.entries]]
kind = "func"
name = "br_plat_unexpected_exception"
sig  = "void (br_u64)"
# ---- 中断子系统(3-02 §14.3 的初始化单向链 + 目标侧一致性用例入口)----
[[export.entries]]
kind = "func"
name = "br_plat_irq_init"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_plat_irq_start"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_plat_timer_ticks"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_plat_timer_stop"
sig  = "void (void)"
[[export.entries]]
kind = "func"
name = "br_plat_irq_conformance"
sig  = "int (void)"
[[export.entries]]
kind = "func"
name = "br_plat_irq_trigger"
sig  = "int (br_u32)"
[[export.entries]]
kind = "func"
name = "br_plat_irq_hwirq"
sig  = "int (br_u32, br_u32*)"

# ---- 导出面 ②: GICv3 方言(interface 单元 `platform/qemu-aarch64#gicv3`)----
#
# 设计 3-02 §4.1: 控制器方言实现 `br_pic_ops_t` 填表(取走/结束/屏蔽/配置/亲和性)。
# 本单元是这层方言的**声明面**: 换控制器型号(PLIC/NVIC/GICv2)就是另一个单元/另一个
# plugin.toml 条目 —— core 里不出现任何控制器型号名(3-02 §1.3)。
[[export]]
name         = "gicv3"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:edb5e16d25517877de07fc495ce80209148b746038208cf7be0df01deef0f094"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_gicv3_register"
sig  = "int (const br_gicv3_cfg_t*)"
[[export.entries]]
kind = "func"
name = "br_gicv3_info"
sig  = "void (br_gicv3_info_t*)"
[[export.entries]]
kind = "func"
name = "br_gicv3_sgi_trigger"
sig  = "int (br_u32)"
[[export.entries]]
kind = "func"
name = "br_gicv3_readback_enabled"
sig  = "int (br_u32, int*)"
[[export.entries]]
kind = "func"
name = "br_gicv3_readback_prio"
sig  = "int (br_u32, br_u8*)"
[[export.entries]]
kind = "func"
name = "br_gicv3_readback_pending"
sig  = "int (br_u32, int*)"
[[export.entries]]
kind = "func"
name = "br_gicv3_raw_line_enable"
sig  = "int (br_u32, int)"
[[export.entries]]
kind = "type"
name = "br_gicv3_cfg_t"
layout = "# {gicd_base, gicr_base, gicr_frame_size, gicr_max_frames, nr_irq}"
[[export.entries]]
kind = "type"
name = "br_gicv3_info_t"
layout = "# {prio_bits, eoimode, spi_lines, mpidr}"
[[export.entries]]
kind = "macro"
name = "BR_GICV3_INTID_SGI_MAX"
value = "15"
[[export.entries]]
kind = "macro"
name = "BR_GICV3_INTID_PPI_BASE"
value = "16"
[[export.entries]]
kind = "macro"
name = "BR_GICV3_INTID_SPI_BASE"
value = "32"
[[export.entries]]
kind = "macro"
name = "BR_GICV3_PMR_ALL"
value = "255"

# ---- 特权面(§3.4)----
[privileged]
level = "P4"                    # machine: MMU/页表/PIC/早期 console 属 platform
[[privileged.resources]]
# 本板用到的中断线(INTID 口径): SGI 0–2(自测/级联父线) + PPI 30(EL1 物理 timer)
# + SPI 33(PL011 UART0)。域成员的 virq 在域窗口内, 不占物理线。
irq          = [0, 1, 2, 30, 33]
dma_channels = []
pins         = []
device_names = ["pl011", "gicv3"]

[build]
sources  = ["src/*.c", "src/*.S"]
includes = ["include"]
