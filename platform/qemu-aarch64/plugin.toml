# ---- 特权面(§3.4)----
# P4(machine): MMU/页表/region 属性/PIC/早期 console 属 platform(3-01 §13.6 的正交表)。
# memory 三轴按**行**声明(同一行内 op × granularity × regions 必须都在该行允许集内,
# 否则 BRV-PRIV-0002), 故拆成三行而不是堆一行:
#   ① map/protect/unmap ⇒ P4, 粒度 page/region, 区域 mmio/reserved/heap(恒等区属性);
#   ② flush/invalidate  ⇒ P2 行, 粒度 byte/page/region, 区域 dma/heap/contig;
#   ③ alloc/free(池生命周期) ⇒ 粒度 pool, 区域 heap/contig/page/dma(平台划池)。
[privileged]
level = "P4"
[[privileged.memory]]
granularity = "page"
ops         = ["map", "protect", "unmap"]
regions     = ["mmio", "reserved", "heap"]
[[privileged.memory]]
granularity = "byte"
ops         = ["flush", "invalidate"]
regions     = ["heap", "contig", "dma"]
[[privileged.memory]]
granularity = "pool"
ops         = ["alloc", "free"]
regions     = ["contig", "page"]
[[privileged.resources]]
# 本板用到的中断线(INTID 口径): SGI 0–2(自测/级联父线) + PPI 30(EL1 物理 timer)
# + SPI 33(PL011 UART0)。域成员的 virq 在域窗口内, 不占物理线。
irq          = [0, 1, 2, 30, 33]
dma_channels = []
pins         = []
device_names = ["pl011", "gicv3"]

[selftest]
# ADR-0010: **表在场 = 本插件有自检** ⇒ 生成物发 `.selftest = <prefix>selftest`。
# 用例: 中断 67 + 内存 35(两个独立文件: src/irq_conf.c / src/mm_conf.c)。开关在 `product.toml [selftest]`(生成期裁决: 关掉 ⇒ 本文件与
# src/*_selftest.c 一起不参与编译, 测试代码不进镜像)。
cases = 102

[build]
sources  = ["src/*.c", "src/*.S"]
includes = ["include"]

# ---------------------------------------------------------------- 目标事实(brickie build)
# `brickie build` 从**唯一一个** platform 插件的本表取目标事实(每镜像恰一个 platform,
# §8.3 ④)。放进 product.toml 会让同一件事有两个可写处 —— 所以归 platform。
[build.target]
arch = "aarch64"
# WORKAROUND(br-wa-toolchain-001): 外部交叉编译器。工具解析顺序 =
#   prebuilts/toolchain/bin/<name> → PATH 上的 <name>(含 gcc-16/-15/-14/-13 变体)
cross = "aarch64-linux-gnu-"

# ⚠ -mstrict-align 在 **MMU 未开时是硬要求, 不是优化选项**: MMU 关着 ⇒ 全部访存按
#   Device-nGnRnE 处理 ⇒ 非对齐访问会取 Alignment fault(ESR.EC=0x25/DFSC=0x21)。
#   而编译器按 Normal memory 的假设可以对 4 字节对齐的地址生成 8 字节 `stur` —— 实测踩到过。
#   -mgeneral-regs-only: 内核不碰 FP/SIMD(设计侧 aarch64 目标的纪律)。
arch_flags = ["-march=armv8-a", "-mgeneral-regs-only", "-mstrict-align"]

# 链接脚本(相对**本插件根**)
linker_script = "src/link.ld"

# QEMU 型号: `gic-version=3` 是**显式**的 —— QEMU virt 的缺省是 GICv2, 而本插件声明的是
# GICv3, 不钉住的话驱动会写 GICv2 的地址, 表现为"PIC 初始化后收不到任何中断"。
[build.target.qemu]
binary  = "qemu-system-aarch64"
machine = "virt,gic-version=3"
cpu     = "cortex-a53"
memory  = "128M"
extra   = ["-nographic"]
