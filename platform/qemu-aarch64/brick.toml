schema = 1

[plugin]
name        = "platform/qemu-aarch64"
plugin_type = "platform"
api_type    = "native"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "QEMU virt (aarch64): reset/向量表/link.ld + PL011 早期 console + arch timer + GICv3 + IRQ 绑定表 + 4KB 恒等映射页表/region 表/MMU 开栈"
license     = "WTFPL"

[[res]]
kind     = "ram"
used_kib = 8192
notes    = "平台容量 = 8 MiB 恒等映射窗口: 页表 20 KiB + 向量表/PIC/一致性用例数据 + 划给 core 的三池(heap 1 MiB/contig 256 KiB/page 1 MiB/DMA 256 KiB/保留 16 KiB)"
[[res]]
kind     = "stack"
used_kib = 4
notes    = "EL1 早期栈(link.ld 里的 64 KiB 预留); 异常帧 320 B 在栈上, 单帧遍历靠 x29 链"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u64  = "uint64_t"
br_u32  = "uint32_t"
br_u8   = "uint8_t"
br_bool = "bool"

