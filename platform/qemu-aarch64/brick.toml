[[export]]
name         = "pci-host"
api_iface    = "native"
form         = "api"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:5d0cfc218c1365a114da4683102957599a6efdac8f1b693dbcef465b93581e2a"
status       = "experimental"

[[export.entries]]
kind = "func"
name = "br_plat_pci_host"
sig  = "int (br_plat_pci_host_t*)"
[[export.entries]]
kind = "type"
name = "br_plat_pci_host_t"
layout = "# {ecam_base, ecam_size, mmio_base, mmio_size, bus_first, bus_last, intx_virq_a}"

[privileged]
level = "P4"
[[privileged.memory]]
granularity = "page"
ops         = ["map", "protect", "unmap"]
regions     = ["mmio", "reserved", "heap"]
[[privileged.memory]]
granularity = "byte"
ops         = ["flush", "invalidate"]
regions     = ["heap", "contig", "dma"]
[[privileged.memory]]
granularity = "pool"
ops         = ["alloc", "free"]
regions     = ["contig", "page"]
[[privileged.resources]]

irq          = [0, 1, 2, 30, 33, 35, 36, 37, 38]
dma_channels = []
pins         = []
device_names = ["pl011", "gicv3", "pcie", "sdhci"]

[selftest]

cases = 102

[build]
sources  = ["src/*.c", "src/*.S"]
includes = ["include"]

[build.target]
arch = "aarch64"

cross = "aarch64-linux-gnu-"

arch_flags = ["-march=armv8-a", "-mgeneral-regs-only", "-mstrict-align"]

linker_script = "src/link.ld"

[build.target.qemu]
binary  = "qemu-system-aarch64"
machine = "virt,gic-version=3,highmem=off"
cpu     = "cortex-a53"
memory  = "128M"
extra   = [
  "-nographic",
  "-drive", "if=none,id=emmc0,format=raw,file=build/emmc0.img",
  "-drive", "if=none,id=emmc1,format=raw,file=build/emmc1.img",
  "-drive", "if=none,id=emmc2,format=raw,file=build/emmc2.img",
  "-drive", "if=none,id=emmc3,format=raw,file=build/emmc3.img",
  "-device", "sdhci-pci,addr=3",
  "-device", "emmc,drive=emmc0",
  "-device", "sdhci-pci,addr=4",
  "-device", "emmc,drive=emmc1",
  "-device", "sdhci-pci,addr=5",
  "-device", "emmc,drive=emmc2",
  "-device", "sdhci-pci,addr=6",
  "-device", "emmc,drive=emmc3",
]
