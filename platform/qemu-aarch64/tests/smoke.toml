# platform/qemu-aarch64 — conformance 用例骨架(人写)
#
# **v0.1 不消费它**(无 test 命令, 排 v0.4, §0 边界纪律); 字段形状照 `6-01` §2, 定稿前按需改。
schema = 1

[[case]]
id       = "plat-0001"
pre      = "start.S 已把异常级别/栈备好; core 的 br_core_main() 已进入阶段 ②, 即将调用 br_plat_early_init()"
steps    = ["调用 br_plat_early_init()", "检查 PL011 已可输出"]
expect   = "早期 console 就绪(br_console_putc 可用)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "plat-0002"
pre      = "br_plat_early_init() 已完成"
steps    = ["br_plat_ticks_freq()", "br_plat_ticks_now() 连读两次"]
expect   = "freq 非 0 且 now 单调不减"
sched    = ["coop"]
platform = ["qemu-aarch64"]

# ---- 中断子系统(设计 3-02 Stage 1; 6-01 §3.7 的 TC-IRQ 组)----
#
# 这些用例在 v0.1 **已经可执行**: 它们就是 `src/irq_conf.c` 编进镜像的那一套,
# 由 `make irq-test` 在 QEMU 上逐项判 PASS/FAIL。这里登记的是"平台侧入口"这一层
# 的梗概; 逐用例的 id/期望见 `6-01` §3.7 与 `irq_conf.c` 的文件头。

[[case]]
id       = "plat-0003"
pre      = "core 的 br_core_main() 阶段 ① 已调 br_irq_cpu_init(); 阶段 ② 的 br_plat_early_init() 进入中断初始化"
steps    = ["br_plat_irq_init()", "检查 GICv3 的 ICC_CTLR_EL1.EOImode/PRIbits", "检查绑定表 5 条"]
expect   = "PIC 注册成功(pic_id>=0)、EOImode==0、绑定表提交成功"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "plat-0004"
pre      = "中断已全局放行; timer PPI(INTID 30)已 register+enable"
steps    = ["br_plat_timer_start(100ms)", "等待 1s", "读 br_irq_stats_get(BR_IRQ_TIMER).count"]
expect   = "count 随时间增长(真实硬件中断投递), 无 panic/spurious"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "plat-0005"
pre      = "中断子系统已初始化"
steps    = ["br_plat_irq_conformance()"]
expect   = "返回 0(全部 TC-IRQ-* / GIC-* 项 PASS); 日志出现 SUMMARY fail=0"
sched    = ["coop"]
platform = ["qemu-aarch64"]

# ---- 插件生命周期(设计 1-01 §9 / 3-05 §2; v0.2 起调用点由插件管理器驱动)----
#
# ★ 与 v0.1 的差别(正是 WORKAROUND br-wa-entry-001 第 ③ 条的还债点): 这三条钩子
#   **不再**由 start.S 直调。core 的四阶段启动链(ADR-0008)按相位调用:
#     EARLY 首要 = qemu_aarch64_early_init(由 br_plugin_manager_platform_init() 显式按
#                  plugin_type 取, 不靠拓扑序; 它对应启动链阶段 ②);
#     CORE 相    = qemu_aarch64_init;
#     START 相   = qemu_aarch64_start(全局开中断之后, APP 的 start 之前)。
#   CORE/START 由 br_plugin_manager_run()(阶段 ④)驱动。
#   证据形态 = 日志里的 `[PLUGIN] phase=… name=platform/qemu-aarch64 rc=0` 逐相三行。

[[case]]
id       = "plat-0008"
pre      = "start.S 已把 CPU 交给 br_core_main(); 阶段 ①(BSS 已清零、br_irq_cpu_init 已跑)已过"
steps    = ["管理器扫 .br_plugins 段", "取第一个 plugin_type = platform 的描述符", "调它的 early_init"]
expect   = "qemu_aarch64_early_init() 是启动链阶段 ②(也是 EARLY 相第一步) ⇒ console/PIC/绑定表/region 表/页表 ops 就位; 日志可观测"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "plat-0006"
pre      = "EARLY 相已过(early_init 返回 0); CORE 相轮到 platform(非 Service/Interface ⇒ CORE)"
steps    = ["qemu_aarch64_init()", "核对日志 [PLUGIN] phase=core name=platform/qemu-aarch64 rc=0"]
expect   = "返回 0(平台自身无额外 init —— 设备都在 EARLY 相就位)"
sched    = ["coop"]
platform = ["qemu-aarch64"]

[[case]]
id       = "plat-0007"
pre      = "LATE 相已过、全局中断已开、START 相轮到 platform"
steps    = [
  "qemu_aarch64_start(): br_plat_irq_start()(arm timer; 两套用例已搬到 qemu_aarch64_selftest, ADR-0010)",
  "再 br_plat_irq_start(): 注册 timer PPI 的 ISR + 使能 + 装 100 ms 期限 + 全局开中断",
  "核对 [PLUGIN] phase=start name=platform/qemu-aarch64 rc=0",
]
expect   = "返回 0; `int: conformance ALL PASS` 与 `[MEMCONF] SUMMARY fail=0` 都在; irq_ticks 随后开始增长"
sched    = ["coop"]
platform = ["qemu-aarch64"]

