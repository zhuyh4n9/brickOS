# ---------------------------------------------------------------- 落点(供 Makefile 读)
# fetch-prebuilt.py 据本表生成 `prebuilts/toolchain/toolchain.mk`(路径由这里决定, 不让 Makefile 去猜
# 发行包解出来的目录名)。Makefile 用 `-include prebuilts/toolchain/toolchain.mk`; 文件不存在 ⇒
# 自动退回宿主外部工具链(过渡形态, 见 br-wa-toolchain-001)。
#
# ⚠ 未纳入: **宿主编译器**。Arm GNU Toolchain 只产目标代码, 编不了宿主程序 ——
#   而 tools/brickie/cxx/(L2 生成器)是宿主 C++。见 ADR-0002 §5-1 与 ADR-0003 §5-2。
# ★ 路径为什么没有 `usr/` 前缀: `.deb` 的 `./usr/...` 前缀被 `strip = 1` 剥掉了一层
#   (与 make/ninja 同款)⇒ 落点是 `<into>/sbin/...` 或 `<into>/bin/...`。
[toolchain]
make  = "make/bin/make"
ninja = "ninja/bin/ninja"
# 默认目标编译器。**不是**直接执行的: brickie 走 tools/toolchain/aarch64-none-elf-clang 包装器
# (它补 --target / lld / LD_LIBRARY_PATH)。这里登记的是被包装的**真身**, 所以它们是否到位
# 能被 `--check` 看出来。
cc    = "clang/usr/lib/llvm-18/bin/clang"
cross = "arm-gnu-toolchain-15.2.rel1/bin/aarch64-none-elf-"
mkfs-fat   = "dosfstools/sbin/mkfs.fat"
fsck-fat   = "dosfstools/sbin/fsck.fat"
mkfs-erofs = "erofs-utils/bin/mkfs.erofs"
dump-erofs = "erofs-utils/bin/dump.erofs"
mcopy      = "mtools/bin/mcopy"
mmd        = "mtools/bin/mmd"
