# ---------------------------------------------------------------- 镜像制作(宿主)
# ADR-0022: eMMC 上的 FAT/EROFS 卷必须由**外部权威工具**造(自研 mkfs 与自研 reader
# 互为镜像, 谁也证明不了谁)。于是把三件小工具纳进同一张锁表 —— 与 make/ninja 同一条
# 纪律: 版本 + URL + sha256 钉死, 取件脚本拒绝没有 sha256 的条目。
#
# ★ 为什么这三件可以纳: 它们都是**用户态小工具**, 且体积可忽略(< 500 KB); 相比之下
#   Arm 工具链 92 MB。它们与 make/ninja 同类 —— **动态链接宿主 glibc**, 所以是"钉住
#   版本"而不是"与环境无关"(同 ADR-0002 §5-2 的代价, 不另开一笔)。
# ★ 为什么不是"把镜像提交进仓库": 那样的字节无法重放(改一个测试文件就得重新生成 +
#   重新提交二进制), 且 FAT32 的最小卷就是 32 MiB —— 版本库里不该有几十 MiB 的稀疏文件。
#
# 候选序(与交叉工具链同款, 见 tools/mk-fs-images.sh):
#   prebuilts/toolchain/<into>/... → PATH 上的同名工具
[[artifact]]
