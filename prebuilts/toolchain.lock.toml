version  = "4.2-1.2build1"
kind     = "deb"
url      = "http://archive.ubuntu.com/ubuntu/pool/main/d/dosfstools/dosfstools_4.2-1.2build1_amd64.deb"
filename = "dosfstools_4.2-1.2build1_amd64.deb"
sha256   = "6b1b2bba6458ca4444cae467db7faff6fd2f350373a95be23333d76dd019c58f"
into     = "dosfstools"
strip    = 1
provenance = "Ubuntu 26.04 (resolute) main 归档"
license  = "GPL-3.0-or-later"
why      = "mkfs.fat(造 FAT12/16/32 卷)与 fsck.fat(独立校验造出来的卷)"

