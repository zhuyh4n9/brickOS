# product.toml — image composition (brickOS prototype v0.2.0, QEMU virt aarch64)
#
# Every root is a record: `brick` names the plugin, `requires` carries that brick's own version
# requirement (`{}` = none). The rest of the image joins by dependency closure (each plugin's
# `[[dep]]`). Roots are the single APP, the platform, the core, and every `[[product.ability]]`
# entry.
schema = 1

[product]
name     = "brickos-prototype"
version  = "0.2.0.0"             # COMPAT_GEN.MAJOR.MINOR.REVISE
app      = { brick = "app/hello", requires = {} }
platform = { brick = "platform/qemu-aarch64", requires = {} }
core     = { brick = "core/c_core", requires = { version = ">=0.1.0" } }
stage    = "dev"                 # dev | release; CLI overrides (§7.5)

# Directly selected abilities. A root pulls in everything it `[[dep]]`s on, so the frameworks
# (dev-core, cdev-core, bdev-core, vfs-core, file-table, pci-core) and the two interface skins
# (iface/posix, iface/min) are deliberately **absent**: they enter the closure through their
# consumers. What is left below is only what no other selected plugin depends on.
#
#   app/hello -> iface/posix -> runtime/posix -> framework/{file-table,vfs-core}
#             -> iface/min (core native pass-through skin: log/clock/tick/version)
#   service/dump -> service/{trace,backtrace,hexdump,memleak}
#   fs/devfs  -> framework/{dev-core,cdev-core} + fs/tmpfs (parent FS of the mount points)
#   driver/uart-pl011 -> framework/{cdev-core,dev-core}
#   fs/uboot-{fat,erofs} -> driver/uboot-mmc -> framework/{bdev-core,dev-core,pci-core}
#
# `fs/devfs`, `driver/uart-pl011` and the eMMC stack stay explicit: the APP mount plan
# ([[mount]] in app/hello) declares / and /dev, and a mount plan does not generate a
# selection edge (WORKAROUND br-wa-fs-001), so dropping a line here removes the volume
# rather than trimming a dependency.
[[product.ability]]
rr    = { brick = "sched/rr", requires = {} }
dump  = { brick = "service/dump", requires = {} }
fat   = { brick = "fs/uboot-fat", requires = {} }
erofs = { brick = "fs/uboot-erofs", requires = {} }
tmpfs = { brick = "fs/tmpfs", requires = {} }
devfs = { brick = "fs/devfs", requires = {} }
uart  = { brick = "driver/uart-pl011", requires = {} }
mmc   = { brick = "driver/uboot-mmc", requires = {} }

[selftest]
# Each plugin's interface tests (`*_selftest()` in <plugin>/src/*_selftest.c), run by core's
# plugin manager after every start and before the scheduler takes over.
#
# Generation-time switch: off ⇒ descriptors write .selftest = BR_PLUGIN_NO_HOOK and the core
# plugin's suite below is not compiled, so the test code is removed by --gc-sections
# (criterion: `[SELFTEST]` vanishes), not merely not run.
# true | false | "inherit" (follow [product].stage: dev on, release off)
enabled = "inherit"
# plugins = []                   # optional: run only these plugins' suites (empty/absent = all)

[budget]
# Plugin budget: Σ [[res]] of the closure <= these values. The platform's own [[res]] is the
# physical capacity (8 MiB) and is a separate axis.
ram_kib   = 256
stack_kib = 16

[kernel]
# Clock interrupts per second (cf. Linux CONFIG_HZ); absent = 200. brickie build turns it into
# -DBR_CFG_TICK_HZ for every compile unit, so platform's reload period and core's jiffies read
# one macro. Valid range 1..100000 (br_time.h _Static_assert).
hz = 200

[lint]
frozen_deps = "inherit"          # inherit (follows [product].stage) | allow | deny
# Empty on purpose: `app/hello -> iface/*` are legal edges, and no illegal edge exists to exempt.
allow_edges = []

[build]
# Image build policy (brickie build). Target facts live in platform [build.target], per-plugin
# sources in each brick.toml [build]; this table adds only product-level flags and outputs.
selftest_sources = ["core/c_core/selftest/*.c"]   # compiled only while the switch above is on
gen_sources      = ["build/gen/**/plugin_desc.c"] # `**` is namespace-depth independent; the tool
                                                  # skips generated output outside the closure
obj_dir          = "build/obj"

# Cross-compilation discipline (every flag has a reason, not a casual optimization switch):
#   -ffreestanding / -fno-builtin  no host runtime assumptions; no silent loop->memcpy
#   -fno-stack-protector           no libc __stack_chk_fail
#   -fno-omit-frame-pointer        compile-time precondition of service/backtrace: unwinding walks
#                                  the x29(fp) chain, while -O2 treats fp as an ordinary register
#                                  => the chain breaks at frame one (one stp/ldp each).
#   -ffunction-sections/-fdata-sections + -Wl,--gc-sections  bare-metal image: unused code stays out
#   -fno-pic/-fno-pie/-no-pie      no relocations on bare metal (identity mapping)
#   -fno-asynchronous-unwind-tables/-fno-unwind-tables  nothing reads .eh_frame
cflags = [
  "-std=c11", "-O2", "-g3",
  "-Wall", "-Wextra", "-Werror", "-Wshadow", "-Wundef", "-Wpointer-arith",
  "-Wstrict-prototypes", "-Wmissing-prototypes",
  "-ffreestanding", "-fno-builtin", "-fno-common", "-fno-stack-protector",
  "-ffunction-sections", "-fdata-sections",
  "-fno-pic", "-fno-pie",
  "-fno-asynchronous-unwind-tables", "-fno-unwind-tables",
  "-fno-omit-frame-pointer",
]
# Assembly is cpp-preprocessed (`__ASSEMBLER__` is defined by GCC), so .S can also include
# <br/core/br_exc.h>: exception frame offsets have a single truth.
asflags = ["-g3"]

ldflags = [
  "-nostdlib", "-nostartfiles", "-static", "-no-pie",
  "-Wl,--build-id=none", "-Wl,--gc-sections", "-Wl,-z,max-page-size=4096",
]
# Linker script and -Wl,-Map are injected by the tool (from platform [build.target] and the
# artifact locations); not repeated here.

[build.release]
# Flags appended by `--profile release`. Empty: dev and release currently differ only in
# composition-time strictness (release forces `brickie check --profile release`).
cflags_extra = []
