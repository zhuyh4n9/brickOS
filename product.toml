# product.toml — 镜像组合(brickOS prototype v0.1.0, QEMU virt aarch64)
#
# 产品级**只声明"选择与预算"**; 插件的自述(dep/export/privileged)只许在各自的
# plugin.toml 里(BRV-D4 唯一真值)。
schema = 1

[product]
name    = "brickos-prototype"
version = "0.1.0.0"             # COMPAT_GEN.MAJOR.MINOR.REVISE
app     = "app/hello"           # 恰一个(§3.2)
core    = ">=0.1.0"
stage   = "dev"                 # dev | release; CLI 覆盖(§7.5)

[select]
# 只列**直接选择**的插件; 其余经依赖闭包拉进来(能力经 `[[dep]]` 声明, 产品只做选择
# —— BRV-D4 唯一真值)。本产品的闭包链:
#   app/hello    → iface/posix(Interface 薄皮肤, ADR-0018)→ runtime/posix
#                → iface/min  (core native 直通皮肤, ADR-0020; 日志/时钟/tick/版本)
#                  ★ 两个 iface 皮肤刻意**不列**在下面: 都由 APP 的 `[[dep]]` 自动拉入
#                    (与 framework/file-table 同款"闭包可读性"取舍)。
#   service/dump → service/{trace,backtrace,hexdump,memleak}
#   fs/devfs     → framework/{dev-core,cdev-core,vfs-core} + fs/tmpfs(挂载点父 FS)
#   io/uart-pl011→ framework/{cdev-core,dev-core,vfs-core}
#   fs/tmpfs     → framework/vfs-core
#                          ↓
#   framework/{vfs-core,dev-core,cdev-core}   (存储/设备域的框架件, ADR-0009)
# ★ 为什么直接列 fs/devfs 与 io/uart-pl011 而不只列 tmpfs: 设计 `1-03` §1 的 v1.0
#   插件清单里这三件(tmpfs rootfs / devfs /dev / uart-pl011 tty)都是**选择项** ——
#   裁剪掉 devfs 就是 `8-01` §1.2 的形态 B(只有设备框架, 无 /dev 命名空间);
#   而 "挂载计划含 / 或 /dev 即拉入"(§1 注)在本原型里还没有生成链路
#   (WORKAROUND br-wa-fs-001), 所以选择权仍显式写在产品侧。
plugins = [
  "platform/qemu-aarch64",
  # ★ ADR-0011: 镜像的调度器从 `sched/coop` 换成 `sched/rr`(时间片轮转抢占)。
  #   为什么必须换: 本刀真正的新机制 = **IRQ 出口换栈**(core)与**下半部**(core),
  #   而它们的唯一消费者就是"有时间片策略的调度器" —— 目标上没有它, 这两条路径
  #   就只能靠宿主用例覆盖, 等于没在真实异常出口上验证过。
  #   `sched/coop` **仍留在树里**: `brickie check` 照旧校验它的声明面与 sched_class
  #   组合, 宿主 `sched-test` 覆盖它的全部分界(含"忙线程不被切走"的 TC-TASK-101)。
  #   换回去只需改这一行(`br_sched_register` 恰一次 ⇒ 一次只能装一个调度器)。
  "sched/rr",
  "service/dump",
  # ★ ADR-0014/0015: POSIX 运行时(runtime/posix)。它的闭包链:
  #   runtime/posix → framework/{file-table, vfs-core} + platform/qemu-aarch64
  #   ⇒ 直接列它一件, 其余两件框架件由 [[dep]] 自动拉入(所以下面那行可以省 —— 留着是为了
  #     "文件表在 POSIX 运行时之外也有独立证据"这件事可读)。
  "runtime/posix",
  # ★ 文件表(fd 表, ADR-0012): runtime/posix 落地后**本行已是冗余**(它经上面的
  #   `runtime/posix --init--> framework/file-table` 自动进闭包)。留着是刻意的:
  #   它让"文件表在 POSIX 运行时之外也有独立证据"这件事在 `[select]` 里可读, 而且
  #   POSIX 运行时被裁掉的产品(极小 native 组合)仍能单独带上 fd 表。删掉它 `check` 依然 0 错。
  "framework/file-table",
  "fs/tmpfs",
  "fs/devfs",
  "io/uart-pl011",
]

[selftest]
# ============================================================ 自检开关(ADR-0010)
#
# 自检 = 各插件的**接口测试**(<plugin>/src/*_selftest.c 里的 `*_selftest()`), 与核心
# 代码分离; 由 core 在"全部 start 之后、调度器接管之前"统一驱动(见 br_plugin.h /
# plugin_mgr.c 的 br_plugin_manager_selftest)。
#
# ★ 这个开关是**生成期**的: 关掉 ⇒ 生成物把描述符的 `.selftest` 写成
#   BR_PLUGIN_NO_HOOK, 且 `core/selftest/**` 不参与编译 ⇒ 测试代码**整段被
#   --gc-sections 裁出镜像**(不是"编了不跑")。判据 = 关掉后 `[SELFTEST]` 段消失。
#
# 语义: true/false 显式; "inherit"(或整表不写) = 跟随 [product].stage
#       —— dev 开 / release 关(开发镜像自带自检, 发布镜像不带)。
enabled = "inherit"
# plugins: 只跑列出的插件(**可选**; 空/不写 = 所有声明了 [selftest] 的插件都跑)。
# 用途: 只在某个镜像里留一两套自检时, 把其余的也一并裁掉。
# plugins = []

[budget]
# 两份上限的分工(brickie-v0.1 §8.1): platform 的 [[res]] = **物理容量**(已抬到 8 MiB:
# 页表 + 划给 core 的三池), 本项 = **插件预算**(各插件 [[res]] 之和 ≤ 本值)。
# 所以本值仍取 64 KiB —— 它管的是"插件代码/数据", 不是 platform 交出来的池容量。
ram_kib   = 64
stack_kib = 16

[kernel]
# ============================================================ 时钟节拍(参考 Linux 的 CONFIG_HZ)
# 每秒多少次时钟中断(Hz)。每 1/HZ 秒, platform 的 timer ISR 走一次:
#   br_clock_tick_notify()(core 的 tick 计数 = jiffies 前进 1)
#   → br_sched_on_tick()(扫到期超时 / 调度器 on_tick 递减时间片)
#   → 重装下一个期限。
# 缺省 200(本项不写 = 200)⇒ 5 ms 一拍。brickie build 把它转成 -DBR_CFG_TICK_HZ,
# 下发到全部编译单元 —— 于是"每秒多少次中断"只有一处真值: platform 的装弹周期
# 与 core 的 jiffies 读同一个宏(ADR-0017)。
# 常见取值 100/200/250/1000; 合法范围 1..100000(br_time.h 的 _Static_assert 兜底)。
hz = 200

[lint]
frozen_deps = "inherit"         # inherit(跟随 [product].stage) | allow | deny
# 显式豁免: **空**。设计 §7.3 的通则是 app 只许依赖 interface; 现在这条通则**已经能满足**:
#   - `app/hello → iface/posix`(Interface 薄皮肤, ADR-0018)与 `app/hello → iface/min`
#     (core native 直通皮肤, ADR-0020)都是方向表里的**合法边**, 不需要豁免;
#   - APP 源码里也不再直连 iface 层以下(`<br/core/...>` 由 ADR-0020 的扫描判红);
#   - 原先那条 M0 引导例外(`app → platform`: 平台身份/心跳)已随 ADR-0016 删除
#     (心跳计数收归 core; 平台身份日志由 platform 自己打)。
# ⇒ 本表保持空。判据不是"加了白名单所以不报", 而是**没有任何非法边**: 删空之后
#   `brickie check` 仍 0 错误。而"声明 ↔ 使用"现在也交叉校验(ADR-0018): 用了别家插件的
#   头却没声明依赖, 在 deps 域与 `brickie build` 都会报红。
allow_edges = [
]

[build]
# ============================================================ 构建策略(brickie build)
#
# ★ 本表是**图片构建的唯一真值**(ADR-0004 / 设计 ADR-0003 的 S1–S3):
#   顶层 Makefile 不再列任何 `core/src/**` / `platform/**` 字面路径 —— 那些由
#   `[select]` 的闭包 + 各插件 `[build]` + platform 的 `[build.target]` 决定。
#
# 分工:
#   目标事实(arch/交叉前缀/arch 标志/链接脚本/QEMU 型号) → platform 插件的 `[build.target]`
#   产品策略(本表) → 编译/汇编/链接标志 + 产物落点 + 核心本体(非插件)的源集合
#   插件自身的源集合 → 各自 plugin.toml 的 `[build]`
#   工具候选序与解析 → `brickie-core`(contract §9 R-14: 生成物要把解析结果烧进去)
#
# WORKAROUND(br-wa-toolchain-001): 外部交叉工具链的**选型**(前缀/变体/链接脚本)写在
#   platform 的 `[build.target]` 里, 本表只写产品策略 —— 内部工具链就绪时改声明面即可,
#   构建规则不动。
core_sources  = ["core/src/*.c", "core/src/*/*.c", "core/src/*/*.S"]
core_includes = ["core/include"]
# 生成物源集合(`brickie gen` 产出的描述符): 插件管理器经 `.br_plugins` 段枚举它们
# (设计 3-05 §2.2)。`**` 与命名空间深度无关(不把"能不能发现生成物"绑死在"插件名恰好
# 两段"); **闭包过滤是工具的责任** —— 不在 `[select]` 闭包里的插件的生成物会被跳过
# (BRV-BLD-0013 info), 所以不会出现"描述符进镜像而它的 .c 没进 ⇒ 链接期未定义符号"。
gen_sources   = ["build/gen/**/plugin_desc.c"]
# core 自检套件的源集合(ADR-0010)。**必须与 core_sources 分开**: core_sources 的
# `core/src/*/*.c` 通配管不到 `core/selftest/`(不同顶层目录), 且自检关掉时这一族
# 压根不编 —— 于是"关掉自检"对 core 侧也是"代码不进镜像"。
selftest_sources = ["core/selftest/*.c"]
obj_dir       = "build/obj"

# 交叉编译纪律(逐条都有理由, 不是"随手加的优化开关"):
#   -ffreestanding / -fno-builtin  无宿主运行时假设; 不把循环偷偷换成 memcpy
#   -fno-stack-protector           没有 libc 的 __stack_chk_fail
#   -fno-omit-frame-pointer        ★ service/backtrace 的**编译期前提**: 栈回溯靠
#                                  x29(fp) 链走查(5-01 §3), 而 -O2 默认会把 fp 当普通
#                                  寄存器省掉 ⇒ 链断在第一帧。代价是每函数一次 stp/ldp。
#   -ffunction-sections/-fdata-sections + -Wl,--gc-sections  裸机镜像要"没用到的不进镜像"
#   -fno-pic/-fno-pie/-no-pie      裸机无重定位(恒等映射, 3-04)
#   -fno-asynchronous-unwind-tables/-fno-unwind-tables  没有 .eh_frame 的读者
cflags = [
  "-std=c11", "-O2", "-g3",
  "-Wall", "-Wextra", "-Werror", "-Wshadow", "-Wundef", "-Wpointer-arith",
  "-Wstrict-prototypes", "-Wmissing-prototypes",
  "-ffreestanding", "-fno-builtin", "-fno-common", "-fno-stack-protector",
  "-ffunction-sections", "-fdata-sections",
  "-fno-pic", "-fno-pie",
  "-fno-asynchronous-unwind-tables", "-fno-unwind-tables",
  "-fno-omit-frame-pointer",
]
# 汇编由 cpp 预处理(`__ASSEMBLER__` 由 GCC 自动定义), 于是 .S 也能
# `#include <br/core/br_exc.h>` —— 异常帧偏移只有一处真值。
asflags = ["-g3"]

ldflags = [
  "-nostdlib", "-nostartfiles", "-static", "-no-pie",
  "-Wl,--build-id=none", "-Wl,--gc-sections", "-Wl,-z,max-page-size=4096",
]
# 链接脚本与 -Wl,-Map 由工具注入(前者来自 platform 的 `[build.target]`, 后者来自产物落点),
# 不在这里重复 —— 一份事实一个可写处。

[build.release]
# `--profile release` **追加**的标志。当前为空: 原型的 dev 与 release 只差
# **组合期检查严格度**(release 强制走 `brickie check --profile release`)。
# 镜像内的断言轴(1-01 §13: debug=panic / release=trace)尚未落地 —— 见 ADR-0004 §4。
cflags_extra = []
