schema = 1

[plugin]
name        = "framework/file-table"
plugin_type = "ability"
api_type    = "native"
subkind     = "framework"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "文件表(fd 表): 小整数 → br_file_t* 的静态定长表 + 最小可用 fd / dup / 最后一个引用判定"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 1
notes    = "32 槽 × 16 B = 512 B(句柄指针 + flags)+ 计数; 纯静态, 无堆分配"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32    = "uint32_t"
br_bool   = "int"
br_size_t = "size_t"

# core layer (ADR-0038): core is a first-class interface provider. Every consumer declares it --
# transitively reaching `<br/core/**>` through another plugin no longer authorizes anything. The
# door is the skin `runtime/core` (one unit per header); `platform` names `core/c_core` directly
# because the direction table forbids a platform from depending on an ability plugin.
[[dep]]
name  = "runtime/core"
range = ">=0.1.0"
kind  = "runtime"

[[export]]
api_iface    = "native"
form         = "api"
name         = "filetable"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:e02f50ee703d2e2836915efa5fae24f430ddbee029a7ef34a2f7a2fae3bcacac"
status       = "experimental"

[[export.entries]]
kind  = "macro"
name  = "BR_FT_MAX"
value = "32u"
[[export.entries]]
kind  = "macro"
name  = "BR_FT_NONE"
value = "(-1)"

[[export.entries]]
kind = "func"
name = "br_ft_reset"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_ft_count"
sig  = "br_u32 (void)"
[[export.entries]]
kind = "func"
name = "br_ft_fd_at"
sig  = "int (br_u32)"

[[export.entries]]
kind = "func"
name = "br_ft_alloc"
sig  = "int (br_file_t*, br_u32)"
[[export.entries]]
kind = "func"
name = "br_ft_get"
sig  = "br_file_t* (int)"
[[export.entries]]
kind = "func"
name = "br_ft_get_flags"
sig  = "int (int, br_u32*)"
[[export.entries]]
kind = "func"
name = "br_ft_set_flags"
sig  = "int (int, br_u32)"
[[export.entries]]
kind = "func"
name = "br_ft_release"
sig  = "int (int, br_file_t**)"
[[export.entries]]
kind = "func"
name = "br_ft_release_all"
sig  = "int (br_file_t**, br_u32)"

[[export.entries]]
kind = "func"
name = "br_ft_dup"
sig  = "int (int)"
[[export.entries]]
kind = "func"
name = "br_ft_dup2"
sig  = "int (int, int, br_file_t**)"

[selftest]

cases = 11

[build]
sources  = ["src/*.c"]
includes = ["include"]
