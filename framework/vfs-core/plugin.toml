# 四层 ops 的**结构布局**(D14: 布局入 golden —— 后补字段 = 二进制不兼容)
[[export.entries]]
kind = "type"
name = "br_file_ops_t"
layout = "# {open, read, write, lseek, ioctl, fsync, poll, poll_attach, close}"
[[export.entries]]
kind = "type"
name = "br_inode_t"
layout = "# {type, iops, fops, fpriv}"
[[export.entries]]
kind = "type"
name = "br_inode_ops_t"
layout = "# {lookup, create, unlink, mkdir, rmdir, rename, getattr, setattr}"
[[export.entries]]
kind = "type"
name = "br_dentry_ops_t"
layout = "# {revalidate, compare}"
[[export.entries]]
kind = "type"
name = "br_fs_ops_t"
layout = "# {mount, free_inode, unmount, sync}"
[[export.entries]]
kind = "type"
name = "br_fs_cfg_t"
layout = "# {path, dev, opts}"
[[export.entries]]
kind = "type"
name = "br_stat_t"
layout = "# {valid, type, size}"
[[export.entries]]
kind = "type"
name = "br_dirent_t"
layout = "# {type, name_len, name}"

