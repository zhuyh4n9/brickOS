# framework/vfs-core — VFS 框架件(plugin_type = ability, subkind = framework)
#
# 设计出处: `docs/7-storage/7-01-vfs.md`(§1 统一可打开模型 SD-1/D21; §2 挂载与 ops 四层
# 分层 SD-15/D23: super/inode/file/dentry,**路径走查在本件**; §3 poll 分期 SD-7)、
# `docs/8-device/8-01-device.md` §1.3(框架件归属: vfs-core = `br_file_t`/`br_open`
# 挂载表·单路由/挂载表/`br_fs_ops`/目录语义;**纯 VFS** —— D21 撤销设备路由, 依赖收缩到 core)。
# 逐条裁定与偏离: `docs/decisions/0009-vfs-storage-stack.md`(本 manifest 是它的声明面)。
#
# ★ 依赖面(deps 为空是**设计结果**, 不是漏写): D21 之后 vfs-core 只依赖 core。
#   设备经 fs/devfs 以文件节点接入 ⇒ 本件零设备知识(见 src/br_vfs.c 的文件头)。
# ★ 相位: `phase = "core"` —— 类别决定的 ② 完成点(ability 且 subkind != service ⇒ CORE)。
#   挂载发生在各 FS 的 CORE init(那时 core 的三池与 MMU 已就绪, 见 ADR-0008)。
schema = 1

[plugin]
name        = "framework/vfs-core"
plugin_type = "ability"
api_type    = "native"
subkind     = "framework"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "纯 VFS: br_file_t 句柄 + 挂载表单路由 + 四层 ops(super/inode/file/dentry 预留) + 逐级 lookup 走查"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 8
notes    = "挂载表 8 槽(路径 64 B/槽)+ 句柄在 core 堆上; 静态部分约 0.6 KiB, 余量给将来的 dentry 预留"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

# ---- 类型别名表(sig 里用的名字 ↔ 底层 C 类型) ----
[iface.typedefs]
br_u8        = "uint8_t"
br_u32       = "uint32_t"
br_u64       = "uint64_t"
br_s64       = "int64_t"
br_size_t    = "size_t"
br_bool      = "int"
br_uintptr_t = "uintptr_t"

# ---- 结构依赖: 无(D21 的"纯 VFS") ----

# ---- 导出面(单元 = 冻结与版本的基本粒度; 本件 = br-vfscore.txt 的候选面) ----
[[export]]
api_iface    = "native"
form         = "api"
name         = "vfs"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:fa92ffcd07657624972308e8c2d8a8625f206cd92275306711e8b9d1a33e7ff9"
status       = "experimental"

