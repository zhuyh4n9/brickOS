# 一致性用例(自编号 TC-VFS-*; 登记在 br-wa-test-001)
[selftest]
# ADR-0010: **表在场 = 本插件有自检** ⇒ 生成物发 `.selftest = <prefix>selftest`。
# 用例: 存储域总套件 TC-VFS-*。开关在 `product.toml [selftest]`(生成期裁决: 关掉 ⇒ 本文件与
# src/*_selftest.c 一起不参与编译, 测试代码不进镜像)。
cases = 13

[build]
