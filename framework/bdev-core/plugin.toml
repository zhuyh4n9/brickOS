# framework/bdev-core — 块设备子分类(plugin_type = ability, subkind = framework)
#
# 设计出处: `docs/7-storage/7-02-bdev.md` §1(`br_bdev_geom_t`/`br_bdev_ops`/`br_bdev_register`/
# `br_bdev_get`)、§2(SD-9 分区映射器 = v1.x)、§3(SD-8 page cache 是堆叠插件)、
# §4(DMA/对齐/cache 约定);`docs/8-device/8-01-device.md` §1.3/§3(D20 形状分离)。
# 逐条裁定与偏离(含 `BR_BDEV_F_DMA/PIO` 两位的来历): `docs/decisions/0021-bdev-pci-emmc.md`。
#
# ★ 依赖面一条:
#   - `framework/dev-core`(**init**): 注册要走它的注册表(设计 §1 的"块设备注册进 dev-core
#     的命名空间" —— 依赖 dev-core 的由来)。
#   dev-core 的对外头 `br_dev.h` 里 `br_dev_class_entry_t.open_file` 的类型引用了
#   `br_file_ops_t`(vfs-core), 所以**编译本件会用到 vfs-core 的头**(O-S7 的类型成本,与
#   cdev-core 同款)—— 故同时声明 `framework/vfs-core`(**type**, 仅头文件)。
schema = 1

[plugin]
name        = "framework/bdev-core"
plugin_type = "ability"
api_type    = "native"
subkind     = "framework"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "块设备子分类: br_bdev_ops(扇区 read/write/flush + 几何 + DMA/PIO 标示)+ br_bdev_register/br_bdev_get; raw 文件面留 v2"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 1
notes    = "bdev 槽 8(约 0.2 KiB); 无每文件状态(open_file 恒 NULL ⇒ 无会话分配)"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32    = "uint32_t"
br_u64    = "uint64_t"
br_size_t = "size_t"

# ---- 结构依赖 ----
[[dep]]
name  = "framework/dev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/vfs-core"
range = ">=0.1.0"
kind  = "type"

# ---- 导出面(本件 = br-bdevcore.txt 的候选面) ----
[[export]]
api_iface    = "native"
form         = "api"
name         = "bdev"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:f195b79af9d3a14797bd05417827b47684d8ab932193f0e1f0cf21c3822f39c3"
status       = "experimental"

# ops/几何布局入 golden(D14/D22: 后补字段 = 二进制不兼容 ⇒ 槽位一次占齐)
[[export.entries]]
kind = "type"
name = "br_bdev_geom_t"
layout = "# {sector_size, n_sectors, max_rw, align, flags}"
[[export.entries]]
kind = "type"
name = "br_bdev_ops_t"
layout = "# {read, write, flush, geometry, ioctl, suspend, resume}"

[[export.entries]]
kind = "macro"
name = "BR_BDEV_F_READONLY"
value = "0x0001u"
[[export.entries]]
kind = "macro"
name = "BR_BDEV_F_STACKED"
value = "0x0002u"
[[export.entries]]
kind = "macro"
name = "BR_BDEV_F_DMA"
value = "0x0004u"
[[export.entries]]
kind = "macro"
name = "BR_BDEV_F_PIO"
value = "0x0008u"

[[export.entries]]
kind = "func"
name = "br_bdev_register"
sig  = "int (const char*, const br_bdev_ops_t*, void*)"
[[export.entries]]
kind = "func"
name = "br_bdev_get"
sig  = "const br_bdev_ops_t* (const char*, void**)"

[selftest]
# ADR-0010: **表在场 = 本插件有自检** ⇒ 生成物发 `.selftest = <prefix>selftest`。
# 用例: TC-BDEV-001..008。开关在 `product.toml [selftest]`(生成期裁决)。
cases = 8

[build]
sources  = ["src/*.c"]
includes = ["include"]
