# framework/cdev-core — 字符设备子分类 + 通用会话适配(plugin_type = ability, subkind = framework)
#
# 设计出处: `docs/8-device/8-01-device.md` §3(`br_cdev_ops` 会话式形状 + `br_cdev_register`;
# **flash 子型** `br_flash_ops`/`br_flash_register`/`br_flash_get` —— spi-nor/nand 对接于此;
# D22/SD-14 统一预留 ioctl/suspend/resume)、§2(D21/D23 的 open_file 钩子 = {fops, fpriv})、
# `docs/7-storage/7-03-concrete-fs.md` §3(cdev-core 提供通用会话适配 `br_file_ops`)。
# 逐条裁定: `docs/decisions/0009-vfs-storage-stack.md`。
#
# ★ 依赖面两条:
#   - `framework/dev-core`(**init**): 注册要走它的注册表(设计 §1.3 的依赖表);
#   - `framework/vfs-core`(**type**, 仅头文件): 适配层返回 `br_file_ops_t`(O-S7 的类型成本)。
#   ⇒ init 边让"dev-core 先就绪"由拓扑序保证; type 边不进闭包(形态 B 仍可裁剪)。
schema = 1

[plugin]
name        = "framework/cdev-core"
plugin_type = "ability"
api_type    = "native"
subkind     = "framework"
lang        = "c"
phase       = "core"
version     = "0.1.0.0"
summary     = "字符设备子分类: br_cdev_ops 会话形状 + flash 子型 + 通用 br_file_ops 会话适配(devfs 经钩子取得)"
license     = "WTFPL"
sched_class = "SAFE_PREEMPT"

[[res]]
kind     = "ram"
used_kib = 2
notes    = "cdev 槽 8 + flash 槽 4(约 0.5 KiB); 每文件会话 cdev_file_t 在 core 堆上(16 B/打开)"

[compat]
core       = ">=0.1.0"
api_rev    = 1
hash_scope = "decl"
truth      = "decl"
abi_id     = ""

[iface.typedefs]
br_u32    = "uint32_t"
br_s64    = "int64_t"
br_size_t = "size_t"

# ---- 结构依赖 ----
[[dep]]
name  = "framework/dev-core"
range = ">=0.1.0"
kind  = "init"

[[dep]]
name  = "framework/vfs-core"
range = ">=0.1.0"
kind  = "type"

# ---- 导出面(本件 = br-cdevcore.txt 的候选面) ----
[[export]]
api_iface    = "native"
form         = "api"
name         = "cdev"
version      = "0.1.0.0"
compat_gen   = 0
freeze_state = "unfrozen"
hash         = "sha256:46b125d4480ef7d3e1d20fe4528a0504d31e973e9678e65c19e58cbf39a40641"
status       = "experimental"

# ops 布局入 golden(D14/D22: 后补字段 = 二进制不兼容 ⇒ 槽位一次占齐)
[[export.entries]]
kind = "type"
name = "br_cdev_ops_t"
layout = "# {open, read, write, ioctl, poll, close, suspend, resume}"
[[export.entries]]
kind = "type"
name = "br_flash_geom_t"
layout = "# {read_size, prog_size, block_size, block_count}"
[[export.entries]]
kind = "type"
name = "br_flash_ops_t"
layout = "# {read, program, erase, sync, ioctl, suspend, resume}"

[[export.entries]]
kind = "func"
name = "br_cdev_register"
sig  = "int (const char*, const br_cdev_ops_t*, void*)"
[[export.entries]]
kind = "func"
name = "br_cdev_get"
sig  = "const br_cdev_ops_t* (const char*, void**)"
[[export.entries]]
kind = "func"
name = "br_flash_register"
sig  = "int (const char*, const br_flash_ops_t*, const br_flash_geom_t*, void*)"
[[export.entries]]
kind = "func"
name = "br_flash_get"
sig  = "const br_flash_ops_t* (const char*, void**)"
[[export.entries]]
kind = "func"
name = "br_flash_geom_get"
sig  = "int (const char*, br_flash_geom_t*)"
[selftest]
# ADR-0010: **表在场 = 本插件有自检** ⇒ 生成物发 `.selftest = <prefix>selftest`。
# 用例: TC-CDEV-*。开关在 `product.toml [selftest]`(生成期裁决: 关掉 ⇒ 本文件与
# src/*_selftest.c 一起不参与编译, 测试代码不进镜像)。
cases = 8

[build]
sources  = ["src/*.c"]
includes = ["include"]
